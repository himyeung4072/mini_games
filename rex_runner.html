<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>METALGREYMON RUNNER - 機械暴龍獸 3D 沙漠跑酷</title>
  <style>
    /* ═══ 基礎與全螢幕滿版設定 ═══ */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ecd9b5;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ═══ 七、極簡 HUD 介面 ═══ */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
      color: #3d3122;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    /* 角落冷卻條：Giga Destroyer */
    .skill-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .skill-label {
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #4a3b28;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .cooldown-track {
      width: 180px;
      height: 11px;
      background: rgba(61, 49, 34, 0.22);
      border: 1px solid rgba(61, 49, 34, 0.55);
      border-radius: 2px;
      overflow: hidden;
    }
    #cooldown-fill {
      width: 100%;
      height: 100%;
      background: #d95a2b;
      transition: background-color 0.2s;
    }
    #cooldown-fill.ready {
      background: #e06d2e;
      box-shadow: 0 0 6px #ff9d42;
    }

    /* 角落細小等寬分數 */
    .score-box {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-align: right;
      color: #3d3122;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      line-height: 1.4;
    }
    .score-hi {
      opacity: 0.65;
      margin-right: 10px;
    }
    #bonus-toast {
      font-size: 16px;
      color: #c84b20;
      opacity: 0;
      transition: opacity 0.2s;
      height: 22px;
    }

    /* 畫面底部中間細字提示 */
    .bottom-hint {
      text-align: center;
      font-size: 16px;
      letter-spacing: 0.8px;
      color: rgba(40, 30, 20, 0.95);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      padding-bottom: 4px;
    }

    /* ═══ Game Over 與開始覆蓋層 ═══ */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(236, 217, 181, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      transition: opacity 0.25s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .panel {
      background: rgba(248, 238, 218, 0.92);
      border: 2px solid #4a3b28;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(61, 49, 34, 0.18);
      max-width: 88%;
    }
    .panel h1 {
      margin: 0 0 8px 0;
      font-size: 20px;
      letter-spacing: 2px;
      color: #3d3122;
    }
    .panel p {
      margin: 6px 0 18px 0;
      font-size: 13px;
      color: #5c4b36;
    }
    .btn {
      pointer-events: auto;
      cursor: pointer;
      background: #3d3122;
      color: #f8eeda;
      border: none;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover {
      background: #c85a28;
    }
    .btn:active {
      transform: scale(0.96);
    }
  </style>
  <!-- ═══ 一、技術要求：固定版本 Three.js r128 CDN ═══ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D 畫布容器 -->
  <div id="canvas-container"></div>

  <!-- 極簡 HUD 介面 -->
  <div id="hud">
    <div class="top-bar">
      <div class="skill-box">
        <div class="skill-label" id="skill-text">GIGA DESTROYER [READY]</div>
        <div class="cooldown-track">
          <div id="cooldown-fill" class="ready"></div>
        </div>
      </div>
      <div class="score-box">
        <div>
          <span class="score-hi" id="level-ind">LV 1</span>
          <span class="score-hi" id="hi-score">HI 00000</span>
          <span id="curr-score">00000</span>
        </div>
        <div id="bonus-toast">+100 DESTROY!</div>
      </div>
    </div>

    <div class="bottom-hint">
      SPACE/↑ 跳躍 · ↓ 蹲低 · F 導彈 &nbsp;|&nbsp; 點擊:跳 · 下掃:蹲 · 雙擊:導彈
    </div>
  </div>

  <!-- 遊戲開始 / Game Over 視窗 -->
  <div id="overlay">
    <div class="panel">
      <h1 id="overlay-title">METALGREYMON RUNNER</h1>
      <p id="overlay-sub">穿越黃昏沙漠 · 避開仙人掌與飛鳥</p>
      <button class="btn" id="action-btn">START RUN</button>
    </div>
  </div>

  <script>
    /*************************************************************************
     * 1. 遊戲全域參數與狀態 (CONFIG & STATE)
     *************************************************************************/
    const CONFIG = {
      baseSpeed: 30,           // 初始跑步速度
      maxSpeed: 92,            // 最高速度上限
      speedAccel: 1.0,         // 每秒加速率
      gravity: -82,            // 跳躍重力加速度
      jumpVelocity: 28,        // 跳躍初速度
      groundY: 0,              // 地面基準高度
      playerScale: 0.75,       // 角色整體縮放（1 = 原大小）
      skillCooldown: 5.0,      // Giga Destroyer 冷卻秒數
      fogColor: 0xecd9b5,      // 沙漠暖奶黃霧色
      skyTopColor: '#8fb8d9',  // 天空頂部淺藍
      skyHorizonColor: '#f5e8ce' // 地平線暖奶白
    };

    const STATE = {
      mode: 'MENU',            // MENU | PLAYING | GAMEOVER
      score: 0,
      bonusScore: 0,
      distance: 0,
      hiScore: parseInt(localStorage.getItem('mg_runner_hi') || '0', 10),
      speed: CONFIG.baseSpeed,
      runTime: 0,
      level: 1,
      cooldown: 0,             // 0 代表可以使用技能
      nextSpawnDist: 20
    };

    /*************************************************************************
     * 2. 8-Bit 晶片音樂與音效合成器 (Web Audio API Chiptune Engine)
     * 完全由程式碼即時生成緊湊刺激的 8-bit BGM 與遊戲音效
     *************************************************************************/
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isPlayingBGM = false;
        this.bgmTimer = null;
        this.step = 0;

        // 緊湊刺激嘅數碼暴龍戰鬥風 8-bit 音階序列 (D小調熱血進行)
        this.melody = [
          587.33, 0, 587.33, 659.25, 698.46, 0, 659.25, 587.33,
          523.25, 0, 523.25, 587.33, 659.25, 0, 523.25, 440.00,
          466.16, 0, 466.16, 523.25, 587.33, 0, 698.46, 659.25,
          587.33, 523.25, 466.16, 440.00, 523.25, 0, 587.33, 0
        ];
        this.bass = [
          146.83, 293.66, 146.83, 293.66, 146.83, 293.66, 146.83, 293.66,
          130.81, 261.63, 130.81, 261.63, 130.81, 261.63, 130.81, 261.63,
          116.54, 233.08, 116.54, 233.08, 116.54, 233.08, 116.54, 233.08,
          110.00, 220.00, 110.00, 220.00, 130.81, 261.63, 146.83, 293.66
        ];
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // 播放單一合成音符
      playTone(freq, type, duration, vol = 0.08, slideTo = null) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      // 播放白噪音（鼓點、爆炸、導彈尾氣）
      playNoise(duration, vol = 0.1, filterFreq = 1200) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterFreq, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      startBGM() {
        this.init();
        if (this.isPlayingBGM) return;
        this.isPlayingBGM = true;
        this.step = 0;
        const stepTime = 125; // 120 BPM 16分音符緊湊節奏

        this.bgmTimer = setInterval(() => {
          if (STATE.mode !== 'PLAYING') return;
          const idx = this.step % this.melody.length;
          const mFreq = this.melody[idx];
          const bFreq = this.bass[idx];

          // 主旋律 (Square 波)
          if (mFreq > 0) {
            this.playTone(mFreq, 'square', 0.11, 0.045);
          }
          // 低音 Bassline (Triangle 波)
          if (bFreq > 0) {
            this.playTone(bFreq, 'triangle', 0.11, 0.07);
          }
          // 8-bit 鼓組節拍
          if (this.step % 4 === 0) {
            this.playTone(110, 'sine', 0.09, 0.12, 35); // Kick
          } else if (this.step % 4 === 2) {
            this.playNoise(0.08, 0.055, 2400); // Snare
          } else {
            this.playNoise(0.03, 0.02, 5000);  // Hi-hat
          }
          this.step++;
        }, stepTime);
      }

      stopBGM() {
        this.isPlayingBGM = false;
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }

      sfxJump() {
        this.init();
        this.playTone(180, 'square', 0.18, 0.07, 540);
      }

      sfxDuck() {
        this.init();
        this.playTone(300, 'triangle', 0.09, 0.06, 120);
      }

      sfxMissile() {
        this.init();
        this.playTone(520, 'sawtooth', 0.28, 0.08, 140);
        this.playNoise(0.32, 0.09, 1800);
      }

      sfxExplode() {
        this.init();
        this.playNoise(0.45, 0.18, 650);
        this.playTone(95, 'sawtooth', 0.35, 0.1, 28);
      }

      sfxGameOver() {
        this.init();
        this.playNoise(0.35, 0.15, 800);
        setTimeout(() => this.playTone(330, 'square', 0.18, 0.08, 293), 100);
        setTimeout(() => this.playTone(293, 'square', 0.18, 0.08, 261), 280);
        setTimeout(() => this.playTone(246, 'sawtooth', 0.45, 0.09, 146), 460);
      }
    }

    const sound = new SoundEngine();

    /*************************************************************************
     * 3. THREE.JS 場景、鏡頭與燈光初始化 (SCENE, CAMERA & LIGHTS)
     *************************************************************************/
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    // 空氣透視霧氣：柔和沙漠暖奶黃色
    scene.fog = new THREE.FogExp2(CONFIG.fogColor, 0.0072);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.5,
      320
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // 限制最高 2
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和陰影
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // 環境光與半球光：營造溫暖柔和嘅黃昏空氣感
    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0xd8be94, 0.72);
    hemiLight.position.set(0, 60, 0);
    scene.add(hemiLight);

    // 低角度太陽（方向光）由左邊照射，投射大面積柔和長影
    const sunLight = new THREE.DirectionalLight(0xfff1d0, 0.95);
    sunLight.position.set(-48, 26, 18);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 5;
    sunLight.shadow.camera.far = 160;
    const d = 48;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    /*************************************************************************
     * 4. 程序化紋理與天空、遠景沙丘、地面生成 (ENVIRONMENT)
     *************************************************************************/
    // 4.1 天空漸變背景（頂部淺藍 #8fb8d9 漸變到地平線暖奶白）
    function createSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 32;
      c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#8fb8d9');
      grad.addColorStop(0.48, '#bfd4e3');
      grad.addColorStop(0.78, '#efe3c8');
      grad.addColorStop(1.0, '#ecd9b5');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }
    scene.background = createSkyTexture();

    // 4.2 遠處細細嘅立體方塊白雲
    const cloudGroup = new THREE.Group();
    const cloudMat = new THREE.MeshBasicMaterial({ color: 0xfdfaf2, fog: false, transparent: true, opacity: 0.88 });
    const cloudBlocks = [
      [0, 0, 0, 8, 2.2, 3],
      [-3.5, -0.4, 0.2, 4.5, 1.5, 2.5],
      [3.8, -0.3, -0.2, 5, 1.6, 2.5],
      [1.0, 1.1, 0, 4.5, 1.4, 2.5]
    ];
    cloudBlocks.forEach(([x, y, z, w, h, d]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cloudMat);
      m.position.set(x, y, z);
      cloudGroup.add(m);
    });
    cloudGroup.position.set(22, 42, -165);
    scene.add(cloudGroup);

    // 4.3 遠景：3 層霧濛濛嘅沙丘剪影（顏色逐層變淡）
    function createDunes() {
      const layers = [
        { z: -175, color: 0xe2cda7, height: 18, scaleX: 1.3, seed: 1.2 },
        { z: -135, color: 0xd7bf96, height: 13, scaleX: 1.0, seed: 2.7 },
        { z: -98,  color: 0xcbb084, height: 8.5, scaleX: 0.85, seed: 4.1 }
      ];

      layers.forEach((layer) => {
        const shape = new THREE.Shape();
        shape.moveTo(-260, -5);
        const steps = 40;
        for (let i = 0; i <= steps; i++) {
          const x = -260 + (520 / steps) * i;
          const y =
            Math.sin(i * 0.35 + layer.seed) * (layer.height * 0.45) +
            Math.cos(i * 0.18 - layer.seed) * (layer.height * 0.35) +
            layer.height * 0.6;
          shape.lineTo(x, y);
        }
        shape.lineTo(260, -5);
        shape.closePath();

        const geom = new THREE.ShapeGeometry(shape);
        const mat = new THREE.MeshBasicMaterial({
          color: layer.color,
          fog: true
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(0, -1, layer.z);
        scene.add(mesh);
      });
    }
    createDunes();

    // 4.4 地面與中央跑道 Canvas 像素噪點紋理
    function createDesertGroundTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 暖奶黃色沙地底色 (#ecd9b5)
      ctx.fillStyle = '#ecd9b5';
      ctx.fillRect(0, 0, 256, 256);

      // 輕微像素感噪點
      for (let y = 0; y < 256; y += 2) {
        for (let x = 0; x < 256; x += 2) {
          const r = Math.random();
          if (r < 0.16) {
            ctx.fillStyle = '#e3cea6';
            ctx.fillRect(x, y, 2, 2);
          } else if (r < 0.24) {
            ctx.fillStyle = '#f2e2c2';
            ctx.fillRect(x, y, 2, 2);
          } else if (r < 0.26) {
            ctx.fillStyle = '#d4bc92';
            ctx.fillRect(x, y, 4, 2);
          }
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(18, 22);
      tex.magFilter = THREE.NearestFilter; // 保留輕微像素感
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    // 中央顏色較深嘅跑道紋理（含腳印同碎石痕跡）
    function createTrailTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#d7be93';
      ctx.fillRect(0, 0, 128, 256);

      // 跑道兩側自然過渡邊緣
      ctx.fillStyle = '#e2caa0';
      ctx.fillRect(0, 0, 10, 256);
      ctx.fillRect(118, 0, 10, 256);

      // 跑道上嘅碎石與橫痕
      for (let i = 0; i < 90; i++) {
        const x = 12 + Math.floor(Math.random() * 104);
        const y = Math.floor(Math.random() * 256);
        ctx.fillStyle = Math.random() > 0.4 ? '#c5aa7d' : '#b89b6d';
        ctx.fillRect(x, y, 4 + Math.floor(Math.random() * 6), 2);
      }

      // 跑道上嘅暴龍三趾腳印痕跡
      ctx.fillStyle = '#c1a578';
      const printY = [32, 96, 160, 224];
      printY.forEach((py, idx) => {
        const px = idx % 2 === 0 ? 38 : 74;
        ctx.fillRect(px, py, 14, 10);
        ctx.fillRect(px - 2, py - 6, 4, 5);
        ctx.fillRect(px + 5, py - 7, 4, 6);
        ctx.fillRect(px + 12, py - 6, 4, 5);
      });

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 14);
      tex.magFilter = THREE.NearestFilter;
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    const groundTex = createDesertGroundTexture();
    const trailTex = createTrailTexture();

    const groundMat = new THREE.MeshStandardMaterial({
      map: groundTex,
      roughness: 0.95,
      metalness: 0.02
    });
    const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(260, 320), groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.set(0, CONFIG.groundY, -90);
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    const trailMat = new THREE.MeshStandardMaterial({
      map: trailTex,
      roughness: 0.96,
      metalness: 0.02,
      polygonOffset: true,
      polygonOffsetFactor: -1
    });
    const trailMesh = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 320), trailMat);
    trailMesh.rotation.x = -Math.PI / 2;
    trailMesh.position.set(0, CONFIG.groundY + 0.02, -90);
    trailMesh.receiveShadow = true;
    scene.add(trailMesh);

    // 4.5 地面循環移動嘅深色小石子、短橫痕與兩邊遠處排成一線嘅細仙人掌
    const groundDetails = [];
    const pebbleMat = new THREE.MeshStandardMaterial({ color: 0xa68b60, roughness: 0.9 });
    const streakMat = new THREE.MeshBasicMaterial({ color: 0xc4a97c });
    const sideCactusMat = new THREE.MeshStandardMaterial({ color: 0x385230, roughness: 0.88 });

    function initGroundDetails() {
      // 散佈細碎深色小石子同短橫痕
      for (let i = 0; i < 85; i++) {
        const isStreak = Math.random() > 0.45;
        let mesh;
        if (isStreak) {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(0.9 + Math.random() * 1.4, 0.05, 0.16), streakMat);
        } else {
          const s = 0.18 + Math.random() * 0.25;
          mesh = new THREE.Mesh(new THREE.BoxGeometry(s, s * 0.6, s), pebbleMat);
          mesh.castShadow = true;
        }
        const side = Math.random() > 0.5 ? 1 : -1;
        const x = (Math.random() < 0.25)
          ? (Math.random() - 0.5) * 6.5
          : side * (4.8 + Math.random() * 38);
        const z = -Math.random() * 210 + 25;
        mesh.position.set(x, 0.04, z);
        scene.add(mesh);
        groundDetails.push(mesh);
      }

      // 跑道兩邊遠處細細嘅深色仙人掌，排成一條線伸向地平線
      for (let i = 0; i < 18; i++) {
        const z = 20 - i * 12;
        [-22, 24].forEach((baseX) => {
          const g = new THREE.Group();
          const h = 1.6 + (i % 3) * 0.35;
          const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.42, h, 0.42), sideCactusMat);
          trunk.position.y = h / 2;
          trunk.castShadow = true;
          g.add(trunk);

          const armL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.28, 0.28), sideCactusMat);
          armL.position.set(-0.35, h * 0.55, 0);
          const armLUp = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.55, 0.28), sideCactusMat);
          armLUp.position.set(-0.52, h * 0.55 + 0.25, 0);
          g.add(armL, armLUp);

          g.position.set(baseX + (Math.random() - 0.5) * 1.8, 0, z);
          scene.add(g);
          groundDetails.push(g);
        });
      }
    }
    initGroundDetails();

    /*************************************************************************
     * 5. 主角：機械暴龍獸 (VOXEL METALGREYMON - 1.3x 比例)
     * 特徵：橙黃皮膚+深啡條紋、銀灰金屬頭盔+前伸尖角+紅眼、高反光金屬胸甲、
     * 左銀灰機械砲臂、右橙色恐龍爪、背脊深色尖刺、粗長尾巴帶金屬環節、三趾粗腿
     *************************************************************************/
    class MetalGreymon {
      constructor() {
        this.root = new THREE.Group();
        // 大小約普通恐龍 1.3 倍
        this.scale = 1.3;
        this.root.scale.set(this.scale, this.scale, this.scale);
        this.root.position.set(0, CONFIG.groundY, 0);

        // 物理與動作狀態
        this.vy = 0;
        this.isGrounded = true;
        this.isDucking = false;
        this.runCycle = 0;
        this.recoilTimer = 0;

        // 碰撞盒
        this.collider = new THREE.Box3();

        this.buildVoxelModel();
        this.root.scale.setScalar(CONFIG.playerScale);
        scene.add(this.root);
      }

      // 輔助建立 Voxel 方塊
      box(w, h, d, mat, x, y, z, castShadow = true) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z);
        m.castShadow = castShadow;
        m.receiveShadow = true;
        return m;
      }

      buildVoxelModel() {

        const matBelly = new THREE.MeshStandardMaterial({ color: 0xf0be78, roughness: 0.8 });
        // 高金屬度、低粗糙度銀灰色胸甲與機械材質
        const matArmorChrome = new THREE.MeshStandardMaterial({ color: 0xdfe5ea, metalness: 0.22, roughness: 0.5 });
        const matHelmetMetal = new THREE.MeshStandardMaterial({ color: 0xb4bdc6, metalness: 0.22, roughness: 0.55 });

        this.torso.add(this.box(1.75, 1.85, 2.05, matOrange, 0, 0.45, -0.1));

        this.torso.add(this.box(1.82, 0.18, 1.5, matStripe, 0, 0.95, 0.05));

        this.torso.add(this.box(1.8, 0.16, 1.4, matStripe, 0, -0.02, 0.15));

        // 胸口銀灰色高反光金屬裝甲板 + 左右發射艙門
        this.chestArmor = new THREE.Group();
        this.chestArmor.position.set(0, 0.65, -1.12);
        this.torso.add(this.chestArmor);
        this.chestArmor.add(this.box(1.68, 1.15, 0.28, matArmorChrome, 0, 0, 0));
        this.chestArmor.add(this.box(0.55, 0.42, 0.34, matDarkMetal, -0.42, 0.08, -0.06));
        this.chestArmor.add(this.box(0.55, 0.42, 0.34, matDarkMetal, 0.42, 0.08, -0.06));

        // 肩膀金屬裝甲部件（背面與側面醒目）
        this.torso.add(this.box(0.65, 0.58, 0.78, matArmorChrome, -1.08, 1.05, -0.15));
        this.torso.add(this.box(0.52, 0.45, 0.65, matHelmetMetal, 1.05, 0.98, -0.15));

        // 背脊一排細細嘅深色尖刺（背面核心視覺）
        for (let i = 0; i < 5; i++) {

          const sz = 0.72 + i * 0.12;
          this.torso.add(this.box(0.24, 0.28, 0.38, matSpike, 0, sy, sz));
        }

        // 背部小型紫翼細節（低角度不遮擋背刺與金屬肩甲）
        const wingL = this.box(0.95, 0.55, 0.08, matWing, -0.75, 1.15, 0.68);
        wingL.rotation.set(0.2, 0.35, 0.35);
        const wingR = this.box(0.95, 0.55, 0.08, matWing, 0.75, 1.15, 0.68);
        wingR.rotation.set(0.2, -0.35, -0.35);
        this.torso.add(wingL, wingR);

        // ── 2. 大型暴龍頭 + 灰色金屬頭盔 + 前伸尖角 + 紅眼 ──
        this.headGroup = new THREE.Group();
        this.headGroup.position.set(0, 1.58, -0.75);
        this.torso.add(this.headGroup);

        // 橙色下顎與臉頰
        this.headGroup.add(this.box(1.42, 0.68, 1.55, matOrange, 0, 0.05, -0.35));
        this.headGroup.add(this.box(1.46, 0.14, 0.9, matStripe, 0, 0.12, -0.2));

        // 銀灰色金屬頭盔/面罩（包覆頭頂、後腦與鼻樑）
        this.headGroup.add(this.box(1.54, 0.78, 1.68, matHelmetMetal, 0, 0.68, -0.32));
        this.headGroup.add(this.box(1.58, 0.32, 0.65, matArmorChrome, 0, 0.58, 0.38)); // 頭盔後緣反光板
        this.headGroup.add(this.box(0.28, 0.25, 0.25, matDarkMetal, -0.62, 0.85, 0.25)); // 頭盔鉚釘
        this.headGroup.add(this.box(0.28, 0.25, 0.25, matDarkMetal, 0.62, 0.85, 0.25));

        // 頭盔兩側後掠翼角
        this.headGroup.add(this.box(0.25, 0.38, 0.75, matArmorChrome, -0.82, 0.82, 0.18));
        this.headGroup.add(this.box(0.25, 0.38, 0.75, matArmorChrome, 0.82, 0.82, 0.18));

        // 頭頂與鼻端向前伸嘅尖角
        const mainHorn = this.box(0.28, 0.32, 1.25, matHorn, 0, 0.72, -1.55);
        mainHorn.rotation.x = 0.22;
        const topHorn = this.box(0.22, 0.68, 0.28, matHorn, 0, 1.25, -0.55);
        topHorn.rotation.x = -0.35;
        this.headGroup.add(mainHorn, topHorn);

        // 發光紅色眼睛
        this.headGroup.add(this.box(0.16, 0.2, 0.36, matRedEye, -0.76, 0.48, -0.55, false));
        this.headGroup.add(this.box(0.16, 0.2, 0.36, matRedEye, 0.76, 0.48, -0.55, false));

        // ── 3. 左手臂：銀灰色巨型機械臂（帶發射口與三叉鋼爪） ──
        this.leftArmGroup = new THREE.Group();
        this.leftArmGroup.position.set(-1.18, 0.82, -0.25);
        this.torso.add(this.leftArmGroup);

        // 機械前臂與裝甲殼
        this.leftArmGroup.add(this.box(0.62, 0.62, 1.35, matArmorChrome, -0.15, -0.15, -0.55));
        this.leftArmGroup.add(this.box(0.68, 0.32, 0.55, matDarkMetal, -0.15, -0.15, -0.45));
        // 機械臂發射口
        this.leftArmGroup.add(this.box(0.36, 0.36, 0.3, matDarkMetal, -0.15, -0.15, -1.28));
        // 三支銀色機械巨爪
        this.leftArmGroup.add(this.box(0.14, 0.14, 0.55, matArmorChrome, -0.35, 0.02, -1.48));
        this.leftArmGroup.add(this.box(0.14, 0.14, 0.55, matArmorChrome, 0.05, 0.02, -1.48));
        this.leftArmGroup.add(this.box(0.14, 0.14, 0.5, matArmorChrome, -0.15, -0.32, -1.45));

        // ── 4. 右手臂：橙色恐龍爪（帶深色條紋） ──
        this.rightArmGroup = new THREE.Group();
        this.rightArmGroup.position.set(1.08, 0.78, -0.25);
        this.torso.add(this.rightArmGroup);

        this.rightArmGroup.add(this.box(0.45, 0.45, 0.95, matOrange, 0.1, -0.15, -0.4));
        this.rightArmGroup.add(this.box(0.48, 0.14, 0.4, matStripe, 0.1, -0.05, -0.35));
        this.rightArmGroup.add(this.box(0.12, 0.12, 0.32, matHorn, 0.0, -0.2, -0.95));
        this.rightArmGroup.add(this.box(0.12, 0.12, 0.32, matHorn, 0.2, -0.2, -0.95));

        // ── 5. 粗長尾巴（向後伸出，後段有銀色金屬環節） ──
        this.tailGroup = new THREE.Group();
        this.tailGroup.position.set(0, 0.1, 0.85);
        this.torso.add(this.tailGroup);

        // 第一節粗尾（橙色配條紋）
        this.tailGroup.add(this.box(1.15, 0.95, 1.35, matOrange, 0, 0, 0.55));
        this.tailGroup.add(this.box(1.18, 0.16, 0.45, matStripe, 0, 0.25, 0.65));

        // 第二節中段與後段（帶金屬環節）
        this.tailMid = new THREE.Group();
        this.tailMid.position.set(0, -0.05, 1.2);
        this.tailGroup.add(this.tailMid);

        this.tailMid.add(this.box(0.82, 0.72, 1.25, matOrange, 0, 0, 0.55));
        // 後段金屬環節 1 & 2
        this.tailMid.add(this.box(0.88, 0.78, 0.32, matArmorChrome, 0, 0, 0.85));
        this.tailMid.add(this.box(0.68, 0.58, 0.32, matDarkMetal, 0, 0.02, 1.25));
        this.tailMid.add(this.box(0.55, 0.48, 0.75, matArmorChrome, 0, 0.05, 1.65));

        // ── 6. 粗壯雙腳與三隻爪趾 ──
        this.leftLeg = this.createLeg(matOrange, matStripe, matHorn, -0.68);
        this.rightLeg = this.createLeg(matOrange, matStripe, matHorn, 0.68);
        this.root.add(this.leftLeg, this.rightLeg);
      }

      createLeg(matOrange, matStripe, matHorn, xOffset) {
        const legGroup = new THREE.Group(); // 髖關節
        legGroup.position.set(xOffset, 1.55, 0.05);

        // 大腿（粗壯，微向前）
        legGroup.add(this.box(0.8, 0.95, 1.0, matOrange, 0, -0.3, -0.1));
        legGroup.add(this.box(0.84, 0.15, 1.02, matStripe, 0, -0.2, -0.1));

        // 膝關節
        const knee = new THREE.Group();
        knee.position.set(0, -0.66, -0.32);
        legGroup.add(knee);
        knee.add(this.box(0.66, 0.46, 0.6, matOrange, 0, 0, -0.04));

        // 小腿（獸腳類：由膝向後下方斜）
        const shin = new THREE.Group();
        shin.rotation.x = -0.5;
        knee.add(shin);
        shin.add(this.box(0.5, 0.85, 0.5, matOrange, 0, -0.4, 0));
        shin.add(this.box(0.54, 0.12, 0.54, matStripe, 0, -0.22, 0));

        // 腳踝 + 腳掌 + 三趾
        const ankle = new THREE.Group();
        ankle.position.set(0, -0.82, 0);
        shin.add(ankle);
        ankle.add(this.box(0.7, 0.24, 0.9, matOrange, 0, -0.08, -0.2));
        ankle.add(this.box(0.18, 0.22, 0.38, matHorn, -0.24, -0.1, -0.78));
        ankle.add(this.box(0.18, 0.22, 0.42, matHorn, 0, -0.1, -0.82));
        ankle.add(this.box(0.18, 0.22, 0.38, matHorn, 0.24, -0.1, -0.78));

        legGroup.userData = { shin, ankle };
        return legGroup;
      }

      // 腿部姿勢：hip 髖擺動角、bend 膝額外彎曲量；k<1 時平滑過渡
      poseLeg(leg, hip, bend, k = 1) {
        const L = THREE.MathUtils.lerp;
        const { shin, ankle } = leg.userData;
        const sTarget = -0.5 - bend;
        leg.rotation.x = k >= 1 ? hip : L(leg.rotation.x, hip, k);
        shin.rotation.x = k >= 1 ? sTarget : L(shin.rotation.x, sTarget, k);
        ankle.rotation.x = -(leg.rotation.x + shin.rotation.x); // 腳掌保持水平
      }

      jump() {
        if (this.isGrounded) {
          this.vy = CONFIG.jumpVelocity;
          this.isGrounded = false;
          this.isDucking = false;
          sound.sfxJump();
        }
      }

      setDuck(ducking) {
        if (ducking && !this.isDucking) {
          sound.sfxDuck();
        }
        this.isDucking = ducking;
        // 若喺空中按蹲低，加速快速落地
        if (ducking && !this.isGrounded && this.vy > -22) {
          this.vy = -34;
        }
      }

      triggerMissilePose() {
        this.recoilTimer = 0.32;
      }

      update(dt, speed) {
        // 垂直物理與拋物線重力
        if (!this.isGrounded) {
          this.vy += CONFIG.gravity * dt;
          this.root.position.y += this.vy * dt;
          if (this.root.position.y <= CONFIG.groundY) {
            this.root.position.y = CONFIG.groundY;
            this.vy = 0;
            this.isGrounded = true;
          }
        }

        // 跑步步伐相位
        this.runCycle += dt * (speed * 0.42);

        if (this.isGrounded) {
          // 跑步動畫：腳步沉重有力，身體隨步伐微微起伏
          const legSwing = Math.sin(this.runCycle) * 0.68;
          const cs = Math.cos(this.runCycle);
          this.poseLeg(this.leftLeg, legSwing, Math.max(0, cs) * 0.75);
          this.poseLeg(this.rightLeg, -legSwing, Math.max(0, -cs) * 0.75);

          const bounce = Math.abs(Math.cos(this.runCycle)) * 0.22;

          if (this.isDucking) {
            // 蹲低動畫：身體壓低、頭向前伸
            this.bodyPivot.position.y = THREE.MathUtils.lerp(this.bodyPivot.position.y, 1.02 + bounce * 0.4, dt * 16);
            this.torso.rotation.x = THREE.MathUtils.lerp(this.torso.rotation.x, -0.58, dt * 16);
            this.headGroup.position.z = THREE.MathUtils.lerp(this.headGroup.position.z, -1.15, dt * 16);
            this.headGroup.rotation.x = THREE.MathUtils.lerp(this.headGroup.rotation.x, 0.32, dt * 16);
            this.leftArmGroup.rotation.x = THREE.MathUtils.lerp(this.leftArmGroup.rotation.x, -0.25, dt * 14);
          } else {
            // 正常奔跑姿態
            this.bodyPivot.position.y = THREE.MathUtils.lerp(this.bodyPivot.position.y, 1.55 + bounce, dt * 16);
            this.torso.rotation.x = THREE.MathUtils.lerp(this.torso.rotation.x, -0.14, dt * 14);
            this.headGroup.position.z = THREE.MathUtils.lerp(this.headGroup.position.z, -0.75, dt * 14);
            this.headGroup.rotation.x = THREE.MathUtils.lerp(this.headGroup.rotation.x, 0.08, dt * 14);
            this.leftArmGroup.rotation.x = THREE.MathUtils.lerp(
              this.leftArmGroup.rotation.x,
              -legSwing * 0.45,
              dt * 14
            );
            this.rightArmGroup.rotation.x = legSwing * 0.45;
          }
        } else {
          // 跳躍動畫：身體前傾，機械左手向前伸
          this.poseLeg(this.leftLeg, -0.45, 0.45, dt * 10);
          this.poseLeg(this.rightLeg, 0.28, 0.85, dt * 10);
          this.torso.rotation.x = THREE.MathUtils.lerp(this.torso.rotation.x, -0.34, dt * 12);
          this.leftArmGroup.rotation.x = THREE.MathUtils.lerp(this.leftArmGroup.rotation.x, 0.12, dt * 12);
          this.rightArmGroup.rotation.x = THREE.MathUtils.lerp(this.rightArmGroup.rotation.x, -0.35, dt * 12);
        }

        // 尾巴慣性擺動
        this.tailGroup.rotation.y = Math.cos(this.runCycle * 0.5) * 0.22;
        this.tailGroup.rotation.x = Math.sin(this.runCycle) * 0.08;
        this.tailMid.rotation.y = Math.sin(this.runCycle * 0.5 - 0.6) * 0.28;

        // 發射 Giga Destroyer 時胸口裝甲微震反衝
        if (this.recoilTimer > 0) {
          this.recoilTimer -= dt;
          this.chestArmor.position.z = -1.26;
        } else {
          this.chestArmor.position.z = THREE.MathUtils.lerp(this.chestArmor.position.z, -1.12, dt * 10);
        }

        // 更新寬鬆且貼合視覺嘅碰撞盒（蹲低時高度明顯降低以避開飛鳥）
        const py = this.root.position.y;
        const maxH = this.isDucking ? 2.55 : 4.9; // 縮放後仍要擋住高位飛鳥（需蹲低閃避）
        const S = CONFIG.playerScale;
        this.collider.min.set(-0.95 * S, py + 0.25 * S, -1.15 * S);
        this.collider.max.set(0.95 * S, py + maxH * S, 1.05 * S);
      }
    }

    const player = new MetalGreymon();

    /*************************************************************************
     * 6. 障礙物系統：仙人掌組合與高低拍翼飛鳥 (OBSTACLES)
     *************************************************************************/
    const obstacles = [];
    const matCactus = new THREE.MeshStandardMaterial({ color: 0x3f5a36, roughness: 0.85 });
    const matCactusDark = new THREE.MeshStandardMaterial({ color: 0x2f4528, roughness: 0.9 });
    const matBirdBody = new THREE.MeshStandardMaterial({ color: 0x4a382b, roughness: 0.75 });
    const matBirdWing = new THREE.MeshStandardMaterial({ color: 0x6b4e37, roughness: 0.75 });
    const matBirdBeak = new THREE.MeshStandardMaterial({ color: 0xe09a32, roughness: 0.6 });

    // 建立單棵方塊仙人掌（有主幹同左右高低手臂）
    function buildSingleCactus(heightScale = 1.0) {
      const g = new THREE.Group();
      const h = 3.2 * heightScale;

      // 主幹
      const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.78, h, 0.78), matCactus);
      trunk.position.y = h / 2;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      g.add(trunk);

      // 左手臂
      const armL1 = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.46, 0.46), matCactus);
      armL1.position.set(-0.68, h * 0.52, 0);
      armL1.castShadow = true;
      const armL2 = new THREE.Mesh(new THREE.BoxGeometry(0.46, 1.05 * heightScale, 0.46), matCactus);
      armL2.position.set(-0.95, h * 0.52 + 0.45 * heightScale, 0);
      armL2.castShadow = true;
      g.add(armL1, armL2);

      // 右手臂
      const armR1 = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.44, 0.44), matCactusDark);
      armR1.position.set(0.62, h * 0.66, 0);
      armR1.castShadow = true;
      const armR2 = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.9 * heightScale, 0.44), matCactusDark);
      armR2.position.set(0.85, h * 0.66 + 0.38 * heightScale, 0);
      armR2.castShadow = true;
      g.add(armR1, armR2);

      return g;
    }

    // 建立仙人掌組合（高矮同 單/雙/三棵組合）
    function createCactusObstacle() {
      const group = new THREE.Group();
      const count = Math.random() < 0.4 ? 1 : (Math.random() < 0.72 ? 2 : 3);
      let maxH = 0;

      for (let i = 0; i < count; i++) {
        const hs = count === 1
          ? (0.85 + Math.random() * 0.45)
          : (0.68 + Math.random() * 0.45);
        const c = buildSingleCactus(hs);
        const offsetX = (i - (count - 1) / 2) * 1.15;
        const offsetZ = (i % 2 === 0 ? 1 : -1) * (i * 0.55);
        c.position.set(offsetX, 0, offsetZ);
        group.add(c);
        if (3.2 * hs > maxH) maxH = 3.2 * hs;
      }

      const halfZ = 0.45 + count * 0.32;
      return {
        type: 'CACTUS',
        mesh: group,
        halfW: 0.75 + count * 0.35,
        minY: 0,
        maxY: maxH - 0.35,
        halfZ: halfZ,
        collider: new THREE.Box3()
      };
    }

    // 建立拍翼飛鳥障礙物（分高低兩種高度）
    function createBirdObstacle() {
      const group = new THREE.Group();
      const isHigh = Math.random() > 0.46;
      // 高飛鳥：站立會撞頭，蹲低可安全穿過；低飛鳥：必須跳躍越過
      const flyY = isHigh ? 3.55 : 1.45;

      const body = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.65, 1.85), matBirdBody);
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.58, 0.75), matBirdBody);
      head.position.set(0, 0.25, 1.15);
      head.castShadow = true;
      group.add(head);

      const beak = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.28, 0.75), matBirdBeak);
      beak.position.set(0, 0.18, 1.75);
      group.add(beak);

      // 左右可拍動翅膀關節
      const leftWingPivot = new THREE.Group();
      leftWingPivot.position.set(-0.45, 0.15, 0);
      const leftWing = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.16, 1.15), matBirdWing);
      leftWing.position.set(-1.05, 0, 0);
      leftWing.castShadow = true;
      leftWingPivot.add(leftWing);

      const rightWingPivot = new THREE.Group();
      rightWingPivot.position.set(0.45, 0.15, 0);
      const rightWing = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.16, 1.15), matBirdWing);
      rightWing.position.set(1.05, 0, 0);
      rightWing.castShadow = true;
      rightWingPivot.add(rightWing);

      group.add(leftWingPivot, rightWingPivot);
      group.position.y = flyY;

      return {
        type: 'BIRD',
        mesh: group,
        leftWingPivot,
        rightWingPivot,
        flapPhase: Math.random() * Math.PI * 2,
        flyY,
        halfW: 1.15,
        minY: flyY - 0.42,
        maxY: flyY + 0.55,
        halfZ: 0.9,
        collider: new THREE.Box3()
      };
    }

    function spawnObstacle() {
      const isBird = STATE.score > 120 && Math.random() < Math.min(0.55, 0.28 + STATE.level * 0.04);
      const obs = isBird ? createBirdObstacle() : createCactusObstacle();
      // 由遠處霧中出現
      obs.mesh.position.z = -185;
      scene.add(obs.mesh);
      obstacles.push(obs);

      // 間距隨速度動態拉闊，保證玩家有充足反應時間
      const tighten = Math.max(0.85, 1 - (STATE.level - 1) * 0.03); // 越高級間距越密（有下限，保證落地空間）
      const minGap = (24 + STATE.speed * 0.72) * tighten;
      const maxGap = minGap + 18 + Math.random() * 14;
      STATE.nextSpawnDist = minGap + Math.random() * (maxGap - minGap);
    }

    /*************************************************************************
     * 7. 特殊技能 GIGA DESTROYER（雙導彈、白煙尾跡與爆炸粒子系統）
     *************************************************************************/
    const missiles = [];
    const particles = [];

    const matMissileBody = new THREE.MeshStandardMaterial({ color: 0x3a434d, metalness: 0.7, roughness: 0.3 });
    const matMissileNose = new THREE.MeshStandardMaterial({ color: 0xd93829, roughness: 0.4 });
    const matSmoke = new THREE.MeshBasicMaterial({ color: 0xf7f4eb, transparent: true, opacity: 0.85 });

    function fireGigaDestroyer() {
      if (STATE.mode !== 'PLAYING' || STATE.cooldown > 0) return;

      STATE.cooldown = CONFIG.skillCooldown;
      player.triggerMissilePose();
      sound.sfxMissile();

      // 從胸口左右發射 2 枚有機體鯊魚頭特徵嘅方塊導彈
      const startY = player.root.position.y + (player.isDucking ? 2.1 : 3.05) * CONFIG.playerScale;
      [-0.65, 0.65].forEach((offsetX) => {
        const mGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 1.35), matMissileBody);
        const nose = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.45), matMissileNose);
        nose.position.z = -0.85;
        mGroup.add(body, nose);

        mGroup.position.set(offsetX, startY, -1.6);
        scene.add(mGroup);

        missiles.push({
          mesh: mGroup,
          speed: STATE.speed + 78,
          smokeTimer: 0,
          collider: new THREE.Box3()
        });
      });
    }

    // 產生導彈白煙尾跡粒子
    function spawnSmokeParticle(pos) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), matSmoke.clone());
      m.material.depthWrite = false;
      m.position.set(
        pos.x + (Math.random() - 0.5) * 0.2,
        pos.y + (Math.random() - 0.5) * 0.2,
        pos.z + 0.7
      );
      scene.add(m);
      particles.push({
        mesh: m,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 1.2 + Math.random() * 2.0,
        vz: 6 + Math.random() * 4,
        life: 0.45,
        maxLife: 0.45,
        grow: 0.9
      });
    }

    // 產生擊爆障礙物嘅爆炸火光與碎塊粒子
    function spawnExplosion(pos, isCactus) {
      const colors = isCactus
        ? [0xff6a2b, 0xffb833, 0x3f5a36, 0xf7f4eb]
        : [0xff6a2b, 0xffb833, 0x6b4e37, 0xf7f4eb];

      for (let i = 0; i < 26; i++) {
        const c = colors[i % colors.length];
        const size = 0.28 + Math.random() * 0.38;
        const mat = new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 1 });
        const m = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), mat);
        m.position.copy(pos);
        m.position.y += 1.2;
        scene.add(m);

        particles.push({
          mesh: m,
          vx: (Math.random() - 0.5) * 22,
          vy: 6 + Math.random() * 18,
          vz: (Math.random() - 0.5) * 22,
          gravity: -42,
          life: 0.55 + Math.random() * 0.25,
          maxLife: 0.8,
          grow: -0.5
        });
      }
    }

    /*************************************************************************
     * 8. 二、鏡頭跟隨系統 (THIRD-PERSON 3/4 BACK CAMERA)
     * 鏡頭喺主角後面偏低，視線望向地平線；主角位置稍為偏左，呈現 3/4 背面
     *************************************************************************/
    const camState = {
      currentPos: new THREE.Vector3(7.6, 4.3, 10.5),
      currentLook: new THREE.Vector3(-2.2, 2.1, -6)
    };

    function updateCamera(dt) {
      const aspect = window.innerWidth / window.innerHeight;
      const isPortrait = aspect < 1.0;

      // 根據手機直向或電腦橫向動態調整偏移，確保主角永遠偏左並露出完整 3/4 背面（頭盔、背刺、左機械手、長尾）
      const baseCamX = isPortrait ? 5.4 : 7.6;
      const baseCamZ = isPortrait ? 14.0 : 10.5;
      const baseCamY = isPortrait ? 5.0 : 4.3;

      // 跑步時輕微晃動 + 跳躍時微微上揚與跟隨延遲
      const runShakeY = player.isGrounded ? Math.sin(player.runCycle * 2) * 0.09 : 0;
      const runShakeX = player.isGrounded ? Math.cos(player.runCycle) * 0.06 : 0;
      const jumpFollowY = player.root.position.y * 0.68;

      const targetPos = new THREE.Vector3(
        baseCamX + runShakeX,
        baseCamY + jumpFollowY + runShakeY,
        baseCamZ
      );

      // 視線略為向前望向地平線，跳躍時鏡頭視角微微上揚
      const jumpPitchLift = player.root.position.y * 0.6;
      const targetLook = new THREE.Vector3(
        isPortrait ? -1.0 : -2.2,
        2.1 + jumpPitchLift,
        -6
      );

      // 柔和跟隨延遲 (Damping)
      camState.currentPos.lerp(targetPos, Math.min(1, dt * 11));
      camState.currentLook.lerp(targetLook, Math.min(1, dt * 11));

      camera.position.copy(camState.currentPos);
      camera.lookAt(camState.currentLook);
    }

    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      // 手機直向稍微放大 FOV 增強速度感與左右視野
      camera.fov = w < h ? 58 : 48;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onWindowResize);
    onWindowResize();

    /*************************************************************************
     * 9. 操控與介面更新 (CONTROLS & HUD)
     *************************************************************************/
    const uiCurrScore = document.getElementById('curr-score');
    const uiHiScore = document.getElementById('hi-score');
    const uiLevel = document.getElementById('level-ind');
    const uiCooldownFill = document.getElementById('cooldown-fill');
    const uiSkillText = document.getElementById('skill-text');
    const uiBonusToast = document.getElementById('bonus-toast');
    const uiOverlay = document.getElementById('overlay');
    const uiOverlayTitle = document.getElementById('overlay-title');
    const uiOverlaySub = document.getElementById('overlay-sub');
    const uiActionBtn = document.getElementById('action-btn');

    function formatScore(num) {
      return String(Math.floor(num)).padStart(5, '0');
    }
    uiHiScore.textContent = 'HI ' + formatScore(STATE.hiScore);

    let bonusToastTimer = null;
    function showBonusToast() {
      uiBonusToast.style.opacity = '1';
      if (bonusToastTimer) clearTimeout(bonusToastTimer);
      bonusToastTimer = setTimeout(() => {
        uiBonusToast.style.opacity = '0';
      }, 900);
    }

    function startGame() {
      // 清理舊障礙物與導彈
      obstacles.forEach((o) => scene.remove(o.mesh));
      obstacles.length = 0;
      missiles.forEach((m) => scene.remove(m.mesh));
      missiles.length = 0;

      STATE.mode = 'PLAYING';
      STATE.score = 0;
      STATE.bonusScore = 0;
      STATE.distance = 0;
      STATE.speed = CONFIG.baseSpeed;
      STATE.cooldown = 0;
      STATE.nextSpawnDist = 26;
      STATE.level = 1;

      player.root.position.y = CONFIG.groundY;
      player.vy = 0;
      player.isGrounded = true;
      player.isDucking = false;

      uiOverlay.classList.add('hidden');
      sound.startBGM();
    }

    function triggerGameOver() {
      STATE.mode = 'GAMEOVER';
      sound.stopBGM();
      sound.sfxGameOver();

      if (STATE.score > STATE.hiScore) {
        STATE.hiScore = Math.floor(STATE.score);
        localStorage.setItem('mg_runner_hi', String(STATE.hiScore));
      }
      uiHiScore.textContent = 'HI ' + formatScore(STATE.hiScore);

      uiOverlayTitle.textContent = 'GAME OVER';
      uiOverlaySub.textContent = `SCORE: ${formatScore(STATE.score)}  ·  BEST: ${formatScore(STATE.hiScore)}`;
      uiActionBtn.textContent = '再玩一次';
      uiOverlay.classList.remove('hidden');
    }

    uiActionBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    // 電腦鍵盤操作：SPACE / ↑ 跳躍、↓ 蹲低、F 導彈
    window.addEventListener('keydown', (e) => {
      if (STATE.mode !== 'PLAYING') {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
          e.preventDefault();
          startGame();
        }
        return;
      }

      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        player.jump();
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        player.setDuck(true);
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        fireGigaDestroyer();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') {
        player.setDuck(false);
      }
    });

    // 手機觸控操作：點擊畫面跳躍、向下掃蹲低、雙擊畫面發射導彈
    let touchStartY = 0;
    let lastTapTime = 0;
    let swipeDuckActive = false;
    let autoStandTimer = null;

    window.addEventListener('touchstart', (e) => {
      if (e.target === uiActionBtn) return;
      if (STATE.mode !== 'PLAYING') return;

      touchStartY = e.touches[0].clientY;
      swipeDuckActive = false;

      const now = performance.now();
      if (now - lastTapTime < 280) {
        // 雙擊觸發 Giga Destroyer
        fireGigaDestroyer();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (STATE.mode !== 'PLAYING') return;
      const dy = e.touches[0].clientY - touchStartY;
      if (dy > 32 && !swipeDuckActive) {
        swipeDuckActive = true;
        player.setDuck(true);
        if (autoStandTimer) clearTimeout(autoStandTimer);
        autoStandTimer = setTimeout(() => {
          player.setDuck(false);
        }, 680);
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.target === uiActionBtn) return;
      if (STATE.mode !== 'PLAYING') return;

      if (!swipeDuckActive) {
        player.jump();
      } else {
        // 放開手指後短暫延遲恢復站立，手感更順暢
        if (autoStandTimer) clearTimeout(autoStandTimer);
        autoStandTimer = setTimeout(() => {
          player.setDuck(false);
        }, 280);
      }
    }, { passive: true });

    /*************************************************************************
     * 10. 主遊戲迴圈 (MAIN LOOP - requestAnimationFrame + delta time)
     *************************************************************************/
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      // 限制最大 delta time 防止切換分頁時物理暴衝
      const dt = Math.min(clock.getDelta(), 0.05);

      if (STATE.mode === 'PLAYING') {
        // 1. 速度隨時間慢慢加快
        STATE.speed = Math.min(CONFIG.maxSpeed, STATE.speed + CONFIG.speedAccel * dt);
        const moveStep = STATE.speed * dt;
        STATE.distance += moveStep;
        STATE.score = Math.floor(STATE.distance * 0.45) + STATE.bonusScore;
        STATE.level = 1 + Math.floor(STATE.score / 500); // 每 500 分升一級
        uiLevel.textContent = 'LV ' + STATE.level;

        // 2. 更新 Giga Destroyer 冷卻條
        if (STATE.cooldown > 0) {
          STATE.cooldown = Math.max(0, STATE.cooldown - dt);
          const ratio = (1 - STATE.cooldown / CONFIG.skillCooldown) * 100;
          uiCooldownFill.style.width = `${ratio}%`;
          uiCooldownFill.classList.remove('ready');
          uiSkillText.textContent = `GIGA DESTROYER [${STATE.cooldown.toFixed(1)}s]`;
        } else {
          uiCooldownFill.style.width = '100%';
          uiCooldownFill.classList.add('ready');
          uiSkillText.textContent = 'GIGA DESTROYER [READY]';
        }

        // 3. 更新分數顯示
        uiCurrScore.textContent = formatScore(STATE.score);
        if (STATE.score > STATE.hiScore) {
          uiHiScore.textContent = 'HI ' + formatScore(STATE.score);
        }

        // 4. 推進障礙物生成與移動
        STATE.nextSpawnDist -= moveStep;
        if (STATE.nextSpawnDist <= 0) {
          spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          const obsSpeed = obs.type === 'BIRD' ? STATE.speed * 1.12 : STATE.speed;
          obs.mesh.position.z += obsSpeed * dt;

          // 飛鳥拍翼動畫
          if (obs.type === 'BIRD') {
            obs.flapPhase += dt * 15;
            const wingAngle = Math.sin(obs.flapPhase) * 0.65;
            obs.leftWingPivot.rotation.z = wingAngle;
            obs.rightWingPivot.rotation.z = -wingAngle;
            obs.mesh.position.y = obs.flyY + Math.cos(obs.flapPhase) * 0.14;
          }

          // 更新障礙物碰撞盒
          const oz = obs.mesh.position.z;
          obs.collider.min.set(-obs.halfW, obs.minY, oz - obs.halfZ);
          obs.collider.max.set(obs.halfW, obs.maxY, oz + obs.halfZ);

          // 與主角進行碰撞偵測
          if (player.collider.intersectsBox(obs.collider)) {
            triggerGameOver();
            break;
          }

          // 超出鏡頭後方則回收移除
          if (obs.mesh.position.z > 24) {
            scene.remove(obs.mesh);
            obstacles.splice(i, 1);
          }
        }

        // 5. 更新 Giga Destroyer 導彈與擊毀判定
        for (let i = missiles.length - 1; i >= 0; i--) {
          const m = missiles[i];
          m.mesh.position.z -= m.speed * dt;
          m.smokeTimer += dt;
          if (m.smokeTimer > 0.025) {
            m.smokeTimer = 0;
            spawnSmokeParticle(m.mesh.position);
          }

          const mp = m.mesh.position;
          m.collider.min.set(mp.x - 1.5, 0, mp.z - 2.2);
          m.collider.max.set(mp.x + 1.5, 6.0, mp.z + 2.2);

          let hit = false;
          for (let j = obstacles.length - 1; j >= 0; j--) {
            const obs = obstacles[j];
            if (m.collider.intersectsBox(obs.collider)) {
              // 擊爆障礙物！產生爆炸粒子、播放音效並加分
              spawnExplosion(obs.mesh.position, obs.type === 'CACTUS');
              sound.sfxExplode();
              scene.remove(obs.mesh);
              obstacles.splice(j, 1);

              STATE.bonusScore += 100;
              showBonusToast();
              hit = true;
              break;
            }
          }

          if (hit || m.mesh.position.z < -180) {
            scene.remove(m.mesh);
            missiles.splice(i, 1);
          }
        }
      }

      // 6. 待機或遊玩時地面與主角持續更新（營造無縫動態畫面）
      const activeSpeed = STATE.mode === 'GAMEOVER' ? 0 : STATE.speed;
      if (activeSpeed > 0) {
        player.update(dt, activeSpeed);

        // 地面與跑道紋理循環向後捲動
        groundTex.offset.y += activeSpeed * dt * 0.068;
        trailTex.offset.y += activeSpeed * dt * 0.043;

        // 地面小石子、橫痕與遠處仙人掌向後循環移動
        for (let i = 0; i < groundDetails.length; i++) {
          const item = groundDetails[i];
          item.position.z += activeSpeed * dt;
          if (item.position.z > 24) {
            item.position.z -= 215;
          }
        }
      }

      // 7. 更新煙霧與爆炸粒子
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
          continue;
        }
        if (p.gravity) p.vy += p.gravity * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.mesh.scale.addScalar(p.grow * dt);
        p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
      }

      // 8. 更新第三人稱電影感鏡頭與渲染
      updateCamera(dt);
      renderer.render(scene, camera);
    }

    animate();
  </script>
