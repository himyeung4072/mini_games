<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Moonlit Slayer</title>
<style>
:root{--ink:#0d1226;--moon:#f1e9c8;--haori:#2f9e57;--flame:#ff8a3d;--water:#7fd6ff}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--moon);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,18,.72)}
.panel{max-width:680px;width:calc(100% - 32px);padding:28px 32px;background:#10162e;border:3px solid var(--haori);
  box-shadow:0 0 0 3px #000,0 0 40px rgba(47,158,87,.25);text-align:center}
h1{margin:0 0 6px;font-size:44px;letter-spacing:2px;color:var(--moon)}
h2{margin:0 0 14px;font-size:30px}
p{font-size:18px;line-height:1.7;margin:8px 0}
.btn,.card{font:inherit;color:var(--moon);background:#1b2447;border:2px solid var(--haori);cursor:pointer;padding:12px 28px;font-size:22px;font-weight:700}
.btn:hover,.card:hover,.btn:focus-visible,.card:focus-visible{background:var(--haori);color:#07110a;outline:none}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.card{width:190px;padding:14px 12px;text-align:left}
.card b{display:block;font-size:22px;margin-bottom:4px}
.card i{font-style:normal;color:var(--flame);font-size:16px}
.card span{display:block;font-size:16px;font-weight:400;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="panel" id="pn"></div></div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), pn = document.getElementById('pn');
let W = 0, H = 0;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }
addEventListener('resize', resize); resize();

/* ───────── 設定 ───────── */
const CFG = { winTime: 600, baseSpeed: 140, spawnBase: 1.2, spawnGrow: 0.04, maxEnemies: 320 };

/* ───────── 音效 ───────── */
let AC = null, muted = false, lastHitSfx = 0;
function sfx(f, d = .08, type = 'square', v = .04, slide = 0){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
}

/* ───────── 升級定義 ───────── */
const UP = {
  slash:{ n:'水面斬', d:'向最近的鬼射出水之斬擊；升級增加傷害、穿透與連射', max:6 },
  orbit:{ n:'水車',   d:'水之刃環繞身旁持續切割；升級增加刀數與傷害', max:6 },
  fire: { n:'火神神樂', d:'定時爆發火焰圓環；升級擴大範圍並縮短間隔', max:6 },
  spd:  { n:'全集中',  d:'移動速度 +10%', max:5 },
  hp:   { n:'鍛鍊',    d:'最大生命 +25 並立即回復', max:5 },
  mag:  { n:'嗅覺',    d:'經驗拾取範圍 +40%', max:5 },
  reg:  { n:'呼吸法',  d:'每秒回復 0.6 生命', max:5 }
};
const ET = [
  { hp:16,  sp:52,  sz:8,  dmg:7,  xp:1,  c:'#7b4aa5' },
  { hp:9,   sp:98,  sz:6,  dmg:5,  xp:1,  c:'#c2493a' },
  { hp:80,  sp:36,  sz:13, dmg:14, xp:4,  c:'#4f6d8a' },
  { hp:900, sp:46,  sz:22, dmg:22, xp:40, c:'#8a1c2b' }
];

/* ───────── 狀態 ───────── */
let mode = 'menu', G, P, enemies, shots, gems, pops, rings, T, orbAng, cam;
const K = {}; let J = null;
function reset(){
  G = { t:0, kills:0, lvl:1, xp:0, need:6, acc:0, nextBoss:60, shake:0, bossMsg:0 };
  P = { x:0, y:0, hp:100, max:100, spd:CFG.baseSpeed, face:1, inv:0, walk:0, moving:false, swing:0,
        mag:70, regen:0, lv:{ slash:1, orbit:0, fire:0, spd:0, hp:0, mag:0, reg:0 } };
  enemies = []; shots = []; gems = []; pops = []; rings = [];
  T = { slash:0.3, fire:2 }; orbAng = 0; cam = { x:0, y:0 };
}

/* ───────── 輸入 ───────── */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  K[k] = 1;
  if (k === 'm') muted = !muted;
  if (mode === 'levelup' && '123'.includes(k) && k) pickCard(+k - 1);
  else if ((mode === 'menu' || mode === 'over') && (k === ' ' || k === 'enter')) start();
  else if (mode === 'play' && (k === 'p' || k === 'escape')) pause(true);
  else if (mode === 'pause' && (k === 'p' || k === 'escape' || k === ' ')) pause(false);
});
addEventListener('keyup', e => { K[e.key.toLowerCase()] = 0; });
cv.addEventListener('pointerdown', e => { J = { sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY }; });
cv.addEventListener('pointermove', e => { if (J){ J.x = e.clientX; J.y = e.clientY; } });
addEventListener('pointerup', () => { J = null; });

/* ───────── 畫面覆蓋層 ───────── */
function show(html){ pn.innerHTML = html; ov.style.display = 'flex'; }
function hide(){ ov.style.display = 'none'; }
function menu(){
  mode = 'menu';
  show(`<h1>MOONLIT SLAYER</h1><h2>月下討鬼 · 倖存者</h2>
  <p>你是炭治郎。整晚不斷湧來的鬼群中，撐到天亮（10:00）。</p>
  <p>移動：WASD / 方向鍵（手機：拖曳畫面）<br>武器自動攻擊，升級時三選一。P 暫停，M 靜音。</p>
  <p><button class="btn" id="go">開始（空白鍵）</button></p>`);
  document.getElementById('go').onclick = start;
}
function pause(on){
  mode = on ? 'pause' : 'play';
  if (on) show(`<h2>暫停</h2><p><button class="btn" id="rs">繼續（P）</button></p>`), document.getElementById('rs').onclick = () => pause(false);
  else hide();
}
function start(){
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  reset(); hide(); mode = 'play';
}
function mmss(s){ s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function gameOver(win){
  mode = 'over';
  show(`<h2>${win ? '天亮了，你撐過了整晚！' : '倒下了…'}</h2>
  <p>存活 ${mmss(G.t)}　擊殺 ${G.kills}　等級 ${G.lvl}</p>
  <p><button class="btn" id="again">再戰一次（空白鍵）</button></p>`);
  document.getElementById('again').onclick = start;
  sfx(win ? 660 : 160, .5, 'triangle', .07, win ? 440 : -80);
}

/* ───────── 升級 ───────── */
let cards = [];
function levelUp(){
  mode = 'levelup';
  const pool = Object.keys(UP).filter(k => P.lv[k] < UP[k].max).sort(() => Math.random() - .5);
  cards = pool.slice(0, 3);
  if (!cards.length){ P.hp = Math.min(P.max, P.hp + 30); mode = 'play'; return; }
  show(`<h2>升級！選擇一項強化</h2><div class="cards">` + cards.map((k, i) =>
    `<button class="card" data-i="${i}"><b>${i + 1}. ${UP[k].n}</b><i>Lv ${P.lv[k]} → ${P.lv[k] + 1}</i><span>${UP[k].d}</span></button>`).join('') + `</div>`);
  pn.querySelectorAll('.card').forEach(b => b.onclick = () => pickCard(+b.dataset.i));
  sfx(520, .25, 'triangle', .06, 520);
}
function pickCard(i){
  const k = cards[i]; if (!k) return;
  P.lv[k]++;
  const l = P.lv[k];
  if (k === 'spd') P.spd = CFG.baseSpeed * (1 + .1 * l);
  if (k === 'hp'){ P.max = 100 + 25 * l; P.hp = Math.min(P.max, P.hp + 25); }
  if (k === 'mag') P.mag = 70 * (1 + .4 * l);
  if (k === 'reg') P.regen = .6 * l;
  hide(); mode = 'play';
  if (G.xp >= G.need) gainXp(0);
}
function gainXp(v){
  G.xp += v;
  if (G.xp >= G.need){ G.xp -= G.need; G.lvl++; G.need = Math.floor(6 + G.lvl * 4.5); levelUp(); }
}

/* ───────── 敵人 / 傷害 ───────── */
function spawn(type){
  const a = Math.random() * 6.283, r = Math.hypot(W, H) / 2 + 40, D = ET[type], sc = 1 + G.t / 100;
  const e = { x:P.x + Math.cos(a) * r, y:P.y + Math.sin(a) * r, type, hp:D.hp * sc, max:D.hp * sc,
    sp:D.sp * (.9 + Math.random() * .25), sz:D.sz, dmg:D.dmg, xp:D.xp, o:0, hit:0, ph:Math.random() * 6, kx:0, ky:0, dead:false };
  enemies.push(e); return e;
}
function hurt(e, amt){
  if (e.dead) return;
  e.hp -= amt; e.hit = .1;
  const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1, kb = e.type === 3 ? 20 : 90;
  e.kx += dx / d * kb; e.ky += dy / d * kb;
  pops.push({ x:e.x, y:e.y - e.sz * 2, t:.5, v:Math.round(amt) });
  if (G.t - lastHitSfx > .05){ lastHitSfx = G.t; sfx(220 + Math.random() * 80, .05, 'square', .025, -60); }
  if (e.hp <= 0){
    e.dead = true; G.kills++;
    gems.push({ x:e.x, y:e.y, v:e.xp, heal:false });
    if (e.type !== 3 && Math.random() < .03) gems.push({ x:e.x + 8, y:e.y, v:0, heal:true });
    if (e.type === 3) for (let i = 0; i < 6; i++) gems.push({ x:e.x + (Math.random() - .5) * 60, y:e.y + (Math.random() - .5) * 60, v:6, heal:false });
  }
}

/* ───────── 更新 ───────── */
function update(dt){
  G.t += dt;
  if (G.t >= CFG.winTime) return gameOver(true);

  // 移動
  let ix = (K.d || K.arrowright ? 1 : 0) - (K.a || K.arrowleft ? 1 : 0);
  let iy = (K.s || K.arrowdown ? 1 : 0) - (K.w || K.arrowup ? 1 : 0);
  if (J){ ix += (J.x - J.sx) / 60; iy += (J.y - J.sy) / 60; }
  const il = Math.hypot(ix, iy);
  P.moving = il > .1;
  if (il > 1){ ix /= il; iy /= il; }
  P.x += ix * P.spd * dt; P.y += iy * P.spd * dt;
  if (ix) P.face = ix > 0 ? 1 : -1;
  if (P.moving) P.walk += dt * 12;
  P.inv -= dt; P.swing -= dt; G.shake = Math.max(0, G.shake - dt * 30);
  P.hp = Math.min(P.max, P.hp + P.regen * dt);

  // 生怪
  G.acc += (CFG.spawnBase + G.t * CFG.spawnGrow) * dt;
  while (G.acc >= 1){
    G.acc -= 1;
    if (enemies.length >= CFG.maxEnemies) continue;
    const r = Math.random(), t = G.t;
    spawn((t > 60 && r < .1 + Math.min(.15, (t - 60) / 600)) ? 2 : (t > 25 && r < .38) ? 1 : 0);
  }
  if (G.t >= G.nextBoss){ spawn(3); G.nextBoss += 60; G.bossMsg = 3; sfx(110, .6, 'sawtooth', .06, -40); }
  G.bossMsg -= dt;

  // 敵人移動與接觸傷害
  for (const e of enemies){
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += (dx / d * e.sp + e.kx) * dt; e.y += (dy / d * e.sp + e.ky) * dt;
    e.kx *= Math.max(0, 1 - dt * 8); e.ky *= Math.max(0, 1 - dt * 8);
    e.hit -= dt; e.o -= dt; e.ph += dt * 6;
    if (d < e.sz + 9 && P.inv <= 0){
      P.hp -= e.dmg; P.inv = .5; G.shake = 6; sfx(120, .12, 'sawtooth', .05, -50);
      if (P.hp <= 0) return gameOver(false);
    }
  }

  // 武器：水面斬
  T.slash -= dt;
  if (T.slash <= 0 && enemies.length){
    let best = null, bd = 1e9;
    for (const e of enemies){ const d = (e.x - P.x) ** 2 + (e.y - P.y) ** 2; if (d < bd){ bd = d; best = e; } }
    if (best){
      const l = P.lv.slash, n = 1 + (l >= 4 ? 1 : 0) + (l >= 6 ? 1 : 0);
      const base = Math.atan2(best.y - P.y, best.x - P.x);
      for (let i = 0; i < n; i++){
        const a = base + (i - (n - 1) / 2) * .22;
        shots.push({ x:P.x, y:P.y, a, vx:Math.cos(a) * 340, vy:Math.sin(a) * 340, life:1.2,
          dmg:14 + 6 * (l - 1), pierce:1 + Math.floor(l / 2), hit:new Set() });
      }
      T.slash = Math.max(.55, 1.2 - .12 * (l - 1)); P.swing = .15; sfx(600, .08, 'triangle', .04, 300);
    }
  }
  for (const s of shots){
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (const e of enemies){
      if (e.dead || s.hit.has(e)) continue;
      if ((e.x - s.x) ** 2 + (e.y - s.y) ** 2 < (e.sz + 14) ** 2){
        s.hit.add(e); hurt(e, s.dmg);
        if (--s.pierce <= 0){ s.life = 0; break; }
      }
    }
  }
  // 武器：水車
  orbAng += dt * 3.2;
  const lo = P.lv.orbit;
  if (lo > 0){
    const n = lo + 1, rad = 58 + 4 * lo;
    for (let i = 0; i < n; i++){
      const a = orbAng + i * 6.283 / n, bx = P.x + Math.cos(a) * rad, by = P.y + Math.sin(a) * rad;
      for (const e of enemies)
        if (!e.dead && e.o <= 0 && (e.x - bx) ** 2 + (e.y - by) ** 2 < (e.sz + 12) ** 2){ hurt(e, 8 + 3 * lo); e.o = .3; }
    }
  }
  // 武器：火神神樂
  const lf = P.lv.fire;
  if (lf > 0){
    T.fire -= dt;
    if (T.fire <= 0){ rings.push({ r:0, max:80 + 14 * lf, dmg:22 + 9 * lf, hit:new Set() }); T.fire = Math.max(1.6, 4.2 - .4 * lf); sfx(180, .35, 'sawtooth', .05, 200); }
  }
  for (const g of rings){
    g.r += dt * 320;
    for (const e of enemies)
      if (!e.dead && !g.hit.has(e) && Math.hypot(e.x - P.x, e.y - P.y) < Math.min(g.r, g.max) + e.sz){ g.hit.add(e); hurt(e, g.dmg); }
  }

  // 經驗寶石
  for (const g of gems){
    const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < P.mag){ g.x += dx / d * 280 * dt; g.y += dy / d * 280 * dt; }
    if (d < 12){
      g.got = true;
      if (g.heal){ P.hp = Math.min(P.max, P.hp + 20); sfx(700, .1, 'triangle', .05, 200); }
      else { sfx(900, .04, 'square', .02); gainXp(g.v); }
      if (mode !== 'play') break;
    }
  }
  for (const p of pops) p.t -= dt;

  enemies = enemies.filter(e => !e.dead); shots = shots.filter(s => s.life > 0);
  gems = gems.filter(g => !g.got); pops = pops.filter(p => p.t > 0); rings = rings.filter(g => g.r < g.max + 20);
  cam.x += (P.x - cam.x) * Math.min(1, dt * 10); cam.y += (P.y - cam.y) * Math.min(1, dt * 10);
}

/* ───────── 繪圖 ───────── */
function drawTanjiro(){
  const u = 2.6, f = P.face, bob = P.moving ? Math.abs(Math.sin(P.walk)) * 1.4 : 0, st = P.moving ? Math.sin(P.walk) * 2 : 0;
  ctx.save(); ctx.translate(Math.round(P.x), Math.round(P.y));
  if (P.inv > 0 && Math.floor(P.inv * 20) % 2) ctx.globalAlpha = .5;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 0, 14, 5, 0, 0, 6.283); ctx.fill();
  const R = (c, a, b, w, h) => { ctx.fillStyle = c; ctx.fillRect(Math.round(a * u), Math.round((b - bob) * u), Math.round(w * u), Math.round(h * u)); };
  R('#14141a', f > 0 ? -7.5 : 5.8, -14, 1.7, 10); R('#c9a227', f > 0 ? -7.5 : 5.8, -4.2, 1.7, 2);     // 背後日輪刀
  R('#14141a', -3.2, -3 + Math.max(0, st) * .3, 2.6, 3); R('#14141a', .6, -3 + Math.max(0, -st) * .3, 2.6, 3); // 腿
  R('#14141a', -4, -9.5, 8, 6.5);                                                                          // 黑制服
  for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) R((i + j) % 2 ? '#16181f' : '#2f9e57', -5 + i * 2, -10 + j * 1.7, 2, 1.7); // 市松羽織
  R('#f2c7a0', -3.5, -15.5, 7, 5.8);                                                                       // 臉
  R('#4a1a1c', -4, -17.2, 8, 2.8); R('#4a1a1c', -4.2, -15, 1.6, 3.4); R('#4a1a1c', 2.6, -15, 1.6, 3.4);  // 髮
  R('#b3262f', f > 0 ? .4 : -1.8, -15, 1.3, 2.2);                                                           // 額頭傷疤
  R('#2a0f10', -2 + f * .5, -12.6, 1.3, 1.6); R('#2a0f10', 1 + f * .5, -12.6, 1.3, 1.6);                    // 眼
  R('#d4382c', -4.8, -12.2, 1.3, 2.4); R('#d4382c', 3.5, -12.2, 1.3, 2.4);                                  // 花札耳飾
  if (P.swing > 0){
    ctx.strokeStyle = '#bfeaff'; ctx.lineWidth = 4; ctx.beginPath();
    ctx.arc(f * 8, -22, 24, f > 0 ? -1.1 : Math.PI - 1.1 + 2.2 - 2.2, f > 0 ? 1.1 : Math.PI + 1.1); ctx.stroke();
  }
  ctx.restore();
}
function drawDemon(e){
  const r = e.sz, bob = Math.sin(e.ph) * 1.5, c = e.hit > 0 ? '#fff' : ET[e.type].c;
  ctx.save(); ctx.translate(Math.round(e.x), Math.round(e.y));
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 0, r * 1.1, r * .4, 0, 0, 6.283); ctx.fill();
  const y0 = Math.round(-r * 1.9 + bob);
  ctx.fillStyle = c; ctx.fillRect(-r, y0, r * 2, Math.round(r * 1.8));
  ctx.fillStyle = '#e8dfc8'; ctx.fillRect(Math.round(-r * .7), Math.round(y0 - r * .4), Math.ceil(r * .35), Math.ceil(r * .45)); ctx.fillRect(Math.round(r * .35), Math.round(y0 - r * .4), Math.ceil(r * .35), Math.ceil(r * .45));
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(-r * .6), Math.round(y0 + r * .5), Math.ceil(r * .4), Math.ceil(r * .3)); ctx.fillRect(Math.round(r * .2), Math.round(y0 + r * .5), Math.ceil(r * .4), Math.ceil(r * .3));
  ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(-r * .5), Math.round(y0 + r * 1.3), Math.ceil(r * .25), Math.ceil(r * .3)); ctx.fillRect(Math.round(r * .25), Math.round(y0 + r * 1.3), Math.ceil(r * .25), Math.ceil(r * .3));
  ctx.restore();
}
function txt(s, x, y, size = 20, align = 'left', col = '#fff'){
  ctx.font = `700 ${size}px "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif`;
  ctx.textAlign = align; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function hash(a, b){ let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

function draw(){
  ctx.fillStyle = '#14202b'; ctx.fillRect(0, 0, W, H);
  if (!G) return;
  const sh = G.shake, ox = Math.round(W / 2 - cam.x + (Math.random() - .5) * sh), oy = Math.round(H / 2 - cam.y + (Math.random() - .5) * sh);
  ctx.save(); ctx.translate(ox, oy);
  // 地面：草叢與碎石
  const S = 48, x0 = Math.floor((cam.x - W / 2) / S) - 1, x1 = Math.ceil((cam.x + W / 2) / S) + 1, y0 = Math.floor((cam.y - H / 2) / S) - 1, y1 = Math.ceil((cam.y + H / 2) / S) + 1;
  for (let tx = x0; tx <= x1; tx++) for (let ty = y0; ty <= y1; ty++){
    const h = hash(tx, ty), px = tx * S + h * 30, py = ty * S + hash(ty, tx) * 30;
    if (h < .55){ ctx.fillStyle = h < .3 ? '#1d3a34' : '#223f38'; ctx.fillRect(px, py, 4, 10); ctx.fillRect(px + 6, py + 3, 4, 7); }
    else if (h > .93){ ctx.fillStyle = '#3b4a5a'; ctx.fillRect(px, py, 9, 6); }
  }
  // 經驗寶石
  for (const g of gems){
    ctx.fillStyle = g.heal ? '#f3efe0' : '#38c8ff'; const s = g.heal ? 7 : (g.v > 3 ? 7 : 5);
    ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(.785); ctx.fillRect(-s / 2, -s / 2, s, s); ctx.restore();
    if (g.heal){ ctx.fillStyle = '#222'; ctx.fillRect(g.x - 2, g.y - 1, 4, 2); }
  }
  // 火圈
  for (const g of rings){
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, g.r - g.max) / 20) * .85;
    ctx.strokeStyle = '#ff8a3d'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(P.x, P.y, Math.min(g.r, g.max), 0, 6.283); ctx.stroke();
    ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 4; ctx.stroke(); ctx.globalAlpha = 1;
  }
  // 依 Y 排序繪製角色與敵人
  const list = enemies.slice(); list.push({ player:true, y:P.y });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) o.player ? drawTanjiro() : drawDemon(o);
  // 水車刀刃
  if (P.lv.orbit > 0){
    const n = P.lv.orbit + 1, rad = 58 + 4 * P.lv.orbit;
    for (let i = 0; i < n; i++){
      const a = orbAng + i * 6.283 / n;
      ctx.save(); ctx.translate(P.x + Math.cos(a) * rad, P.y + Math.sin(a) * rad); ctx.rotate(a + 1.57);
      ctx.fillStyle = '#7fd6ff'; ctx.fillRect(-4, -14, 8, 28); ctx.fillStyle = '#eaf9ff'; ctx.fillRect(-1.5, -14, 3, 28); ctx.restore();
    }
  }
  // 水之斬擊
  for (const s of shots){
    ctx.strokeStyle = '#7fd6ff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(s.x - Math.cos(s.a) * 10, s.y - Math.sin(s.a) * 10, 18, s.a - 1.1, s.a + 1.1); ctx.stroke();
    ctx.strokeStyle = '#eaf9ff'; ctx.lineWidth = 2; ctx.stroke();
  }
  for (const p of pops) txt(String(p.v), p.x, p.y - (.5 - p.t) * 30, 16, 'center', '#ffe9a8');
  ctx.restore();

  // 月夜暗角
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  vg.addColorStop(0, 'rgba(8,10,30,0)'); vg.addColorStop(1, 'rgba(8,10,30,.6)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // HUD
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 16); ctx.fillStyle = '#38c8ff'; ctx.fillRect(0, 0, W * G.xp / G.need, 14);
  txt('LV ' + G.lvl, 16, 42, 24);
  ctx.fillStyle = '#000'; ctx.fillRect(14, 54, 252, 26); ctx.fillStyle = '#3a1013'; ctx.fillRect(16, 56, 248, 22);
  ctx.fillStyle = '#e0463c'; ctx.fillRect(16, 56, 248 * Math.max(0, P.hp) / P.max, 22);
  txt(`HP ${Math.ceil(Math.max(0, P.hp))}/${P.max}`, 24, 74, 18);
  txt(mmss(G.t), W - 16, 44, 30, 'right'); txt('擊殺 ' + G.kills, W - 16, 74, 20, 'right');
  let yy = H - 16;
  for (const k of ['slash', 'orbit', 'fire']) if (P.lv[k] > 0){ txt(`${UP[k].n}  Lv ${P.lv[k]}`, 16, yy, 18); yy -= 26; }
  const boss = enemies.find(e => e.type === 3);
  if (boss){ const bw = Math.min(480, W - 40), bx = (W - bw) / 2; ctx.fillStyle = '#000'; ctx.fillRect(bx - 2, 94, bw + 4, 18); ctx.fillStyle = '#8a1c2b'; ctx.fillRect(bx, 96, bw * boss.hp / boss.max, 14); txt('強大的鬼', W / 2, 90, 16, 'center'); }
  if (G.bossMsg > 0) txt('強大的鬼出現了！', W / 2, H * .3, 36, 'center', '#ff6a5a');
  if (J){ ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(J.sx, J.sy, 50, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.arc(J.x, J.y, 20, 0, 6.283); ctx.stroke(); }
}

/* ───────── 主迴圈 ───────── */
let last = 0;
function loop(ts){
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (mode === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset(); menu(); requestAnimationFrame(loop);
window.__test = { update, draw, start, get G(){ return G; }, get P(){ return P; }, pickCard, get mode(){ return mode; } };
})();
</script>
