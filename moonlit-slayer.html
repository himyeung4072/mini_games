<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Moonlit Slayer</title>
<style>
:root{--ink:#0d1226;--moon:#f1e9c8;--haori:#2f9e57;--flame:#ff8a3d;--water:#7fd6ff}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--moon);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,18,.72)}
.panel{max-width:680px;width:calc(100% - 32px);padding:28px 32px;background:#10162e;border:3px solid var(--haori);
  box-shadow:0 0 0 3px #000,0 0 40px rgba(47,158,87,.25);text-align:center}
h1{margin:0 0 6px;font-size:44px;letter-spacing:2px;color:var(--moon)}
h2{margin:0 0 14px;font-size:30px}
p{font-size:18px;line-height:1.7;margin:8px 0}
.btn,.card{font:inherit;color:var(--moon);background:#1b2447;border:2px solid var(--haori);cursor:pointer;padding:12px 28px;font-size:22px;font-weight:700}
.btn:hover,.card:hover,.btn:focus-visible,.card:focus-visible{background:var(--haori);color:#07110a;outline:none}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.card{width:190px;padding:14px 12px;text-align:left}
.card b{display:block;font-size:22px;margin-bottom:4px}
.card i{font-style:normal;color:var(--flame);font-size:16px}
#pb{position:fixed;top:132px;right:16px;display:none;padding:8px 16px;font-size:18px;z-index:5}
h3{margin:14px 0 4px;font-size:22px;color:var(--flame)}
table{margin:6px auto;border-collapse:collapse;font-size:18px}
td,th{padding:3px 16px;border-bottom:1px solid #26305a}
tr.me{color:var(--flame);font-weight:700}
input#nm{font:inherit;font-size:22px;padding:8px 12px;width:200px;background:#0b1024;color:var(--moon);border:2px solid var(--haori);text-align:center}
.card span{display:block;font-size:16px;font-weight:400;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="btn" id="pb">⏸ 暫停</button>
<div id="ov"><div class="panel" id="pn"></div></div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), pn = document.getElementById('pn'), pb = document.getElementById('pb');
let W = 0, H = 0;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }
addEventListener('resize', resize); resize();

/* ───────── 設定 ───────── */
const CFG = { baseSpeed: 140, maxEnemies: 260, restTime: 4 };
// 水車：每把刀有耐久（可擋彈數），擋滿即碎，數秒後重生
const FIRE_SPIN = 1;   // 火神神樂旋轉方向：1 = 順時針（火焰尾巴拖在後面），-1 = 逆時針
const CY = -22;   // 角色身體中心（相對腳下）：所有由角色擴散的招式都由此點發出
const ORB = { dur:[0, 2, 2, 3, 3, 4, 4], resp:lo => 12 - .8 * lo, R0:lo => 36 + 3 * lo, L:36, cy:-22 };

/* ───────── 音效 ───────── */
let AC = null, muted = false, lastHitSfx = 0;
function sfx(f, d = .08, type = 'square', v = .04, slide = 0){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
}

/* ───────── 背景音樂：熱血輕快（Am–F–C–G 進行、四踩底鼓、方波主旋律與琶音）───────── */
let musicBus = null, nextT = 0, mstep = 0, mTimer = null, noiseBuf = null;
const ROOT = [0, -4, 3, -2];                       // Am F C G 的根音（半音，A=0）
const CHORD = [[0, 3, 7], [0, 4, 7], [0, 4, 7], [0, 4, 7]];
const LEAD = [
  [12,null,15,null,17,null,15,12, 19,null,17,null,15,null,12,null],
  [12,null,15,null,12,null,10,12, 15,null,17,null,15,null,12,null],
  [15,null,19,null,17,null,15,12, 15,null,17,null,19,null,22,null],
  [19,null,17,null,15,null,12,null, 10,12,15,17,19,null,22,24]
];
function note(f, t, d, type, v, lp){
  const o = AC.createOscillator(), g = AC.createGain(), fl = AC.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f, t);
  fl.type = 'lowpass'; fl.frequency.value = lp;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(fl); fl.connect(g); g.connect(musicBus); o.start(t); o.stop(t + d + .02);
}
function kick(t, v){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + .24);
}
function noiseHit(t, v, hp, d){
  if (!noiseBuf){ noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * .15), AC.sampleRate); const dd = noiseBuf.getChannelData(0); for (let i = 0; i < dd.length; i++) dd[i] = Math.random() * 2 - 1; }
  const n = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  n.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  n.connect(f); f.connect(g); g.connect(musicBus); n.start(t); n.stop(t + d + .01);
}
function playStep(s, t){
  const bar = Math.floor(s / 16) % 4, i = s % 16, w = G ? G.wave : 0, root = ROOT[bar];
  // 鼓組：四踩底鼓、2/4 拍軍鼓、八分／十六分腳踏
  if (i % 4 === 0) kick(t, .5);
  if (i === 4 || i === 12){ noiseHit(t, .16, 1800, .14); note(190, t, .1, 'triangle', .08, 1500); }
  if (i % 2 === 0) noiseHit(t, .05, 7000, .04); else if (w >= 3) noiseHit(t, .025, 7000, .03);
  if (i === 0 && bar === 0) noiseHit(t, .1, 5000, .5);        // 每四小節的鈸
  // 貝斯：八分音符推進
  if (i % 2 === 0){ const bn = (i % 8 === 6) ? 12 : 0; note(55 * Math.pow(2, (root + bn) / 12), t, .14, 'sawtooth', .085, 520); }
  // 琶音（第 2 波起加入）
  if (w >= 2){ const ch = CHORD[bar], tone = ch[[0, 1, 2, 1][i % 4]]; note(220 * Math.pow(2, (root + tone + 12) / 12), t, .1, 'square', .026, 2600); }
  // 主旋律
  const n = LEAD[bar][i];
  if (n != null){ const f = 220 * Math.pow(2, n / 12); note(f, t, .22, 'square', .05, 3200); note(f * 2, t, .12, 'triangle', .02, 3500); }
}
function tick(){
  if (!AC) return;
  const bpm = 150 + Math.min(G ? G.wave : 0, 8) * 3, sd = 60 / bpm / 4;
  while (nextT < AC.currentTime + .2){
    if ((mode === 'play' || mode === 'levelup') && !muted) playStep(mstep, nextT);
    mstep++; nextT += sd;
  }
}
function startMusic(){
  if (mTimer) return;
  musicBus = AC.createGain(); musicBus.gain.value = .55; musicBus.connect(AC.destination);
  nextT = AC.currentTime + .1; mTimer = setInterval(tick, 40);
}

/* ───────── 升級定義 ───────── */
const MAX_WEAPONS = 4, MAX_PASSIVES = 3, PASSIVES = ['spd', 'hp', 'mag', 'reg'];
const UP = {
  slash:{ n:'水面斬', d:'向最近的鬼射出水之斬擊；升級增加傷害、穿透與連射', max:6 },
  orbit:{ n:'水車',   d:'武士刀環繞身旁切割並擋下鬼的彈幕；每把刀有耐久，擋滿即碎、數秒後重生；升級增加刀數、傷害與耐久', max:6 },
  fire: { n:'火神神樂', d:'定時爆發火焰；越遠威力越弱，只能擋下近身彈幕；升級擴大範圍並縮短間隔', max:6 },
  ripple:{ n:'滴波紋突', d:'向最近的鬼突刺，貫穿一整條直線；升級加傷害與長度，4 級起前後同時突刺', max:6 },
  dragon:{ n:'日暈之龍·頭舞', d:'向四周噴出貫穿的火焰之龍，飛越遠越透明、威力越弱；升級增加數量與傷害', max:6 },
  calm: { n:'凪', d:'水之結界：擋下一次攻擊並定時恢復；升級增加層數與恢復速度', max:6 },
  spd:  { n:'全集中',  d:'移動速度 +10%', max:5 },
  hp:   { n:'鍛鍊',    d:'最大生命 +25 並立即回復', max:5 },
  mag:  { n:'嗅覺',    d:'經驗拾取範圍 +40%', max:5 },
  reg:  { n:'呼吸法',  d:'每秒回復 0.6 生命', max:3 }
};
const WEAPONS = ['slash', 'orbit', 'fire', 'ripple', 'dragon', 'calm'];
const ET = [
  { hp:20,   sp:56,  sz:8,  dmg:9,  xp:1,  c:'#7b4aa5' },
  { hp:11,   sp:104, sz:6,  dmg:7,  xp:1,  c:'#c2493a' },
  { hp:100,  sp:38,  sz:13, dmg:18, xp:4,  c:'#4f6d8a' },
  { hp:1100, sp:48,  sz:22, dmg:26, xp:40, c:'#8a1c2b', rng:1 },
  { hp:26,   sp:46,  sz:8,  dmg:8,  xp:2,  c:'#b8892e', rng:1 },
  { hp:40,   sp:40,  sz:9,  dmg:8,  xp:3,  c:'#2f8f8a', rng:1 },
  { hp:70,   sp:42,  sz:12, dmg:16, xp:3,  c:'#5b7a8c' },   // 6 盾鬼：免疫擊退（第 8 波起）
  { hp:45,   sp:50,  sz:10, dmg:14, xp:3,  c:'#d9582f' },   // 7 衝鋒鬼：預警後直線衝刺（第 10 波起）
  { hp:60,   sp:44,  sz:11, dmg:10, xp:3,  c:'#5a8f3a' }    // 8 分裂鬼：死後分裂成 3 隻快鬼（第 12 波起）
];

/* ───────── 狀態 ───────── */
let zones = [], mode = 'menu', G, P, enemies, shots, gems, pops, rings, T, orbAng, cam, eshots, thr, parts = [], playerName = '炭治郎', lastMode = '', orbSw = [];
const K = {}; let J = null;
function reset(){
  G = { t:0, kills:0, lvl:1, xp:0, need:9, acc:0, shake:0, bossMsg:0, wave:0, waveT:0, burstT:0, phase:'rest', restT:1.5, banner:null,
        score:0, combo:0, comboT:0, flash:0, flashW:0, best:(loadHS()[0] || {}).score || 0 };
  P = { x:0, y:0, hp:100, max:100, spd:CFG.baseSpeed, face:1, inv:0, walk:0, moving:false, swing:0,
        mag:70, regen:0, shield:0, shieldMax:0, shT:5,
        lv:{ slash:1, orbit:0, fire:0, ripple:0, dragon:0, calm:0, spd:0, hp:0, mag:0, reg:0 } };
  enemies = []; shots = []; gems = []; pops = []; rings = []; eshots = []; thr = []; parts = []; zones = [];
  T = { slash:0.3, fire:2, ripple:1, dragon:2 }; orbAng = 0; orbSw = []; cam = { x:0, y:0 };
}

/* ───────── 輸入 ───────── */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (e.target && e.target.tagName === 'INPUT'){ if (k === 'enter' && mode === 'menu') start(); return; }
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  K[k] = 1;
  if (k === 'm') muted = !muted;
  if (mode === 'levelup' && '123'.includes(k) && k) pickCard(+k - 1);
  else if ((mode === 'menu' || mode === 'over') && (k === ' ' || k === 'enter')) start();
  else if (mode === 'play' && (k === 'p' || k === 'escape')) pause(true);
  else if (mode === 'pause' && (k === 'p' || k === 'escape' || k === ' ')) pause(false);
});
addEventListener('keyup', e => { K[e.key.toLowerCase()] = 0; });
cv.addEventListener('pointerdown', e => { J = { sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY }; });
cv.addEventListener('pointermove', e => { if (J){ J.x = e.clientX; J.y = e.clientY; } });
addEventListener('pointerup', () => { J = null; });

/* ───────── 畫面覆蓋層 ───────── */
function show(html){ pn.innerHTML = html; ov.style.display = 'flex'; }
function hide(){ ov.style.display = 'none'; }
pb.onclick = () => { pb.blur(); if (mode === 'play') pause(true); else if (mode === 'pause') pause(false); };
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(true); });
const HS_KEY = 'moonlitSlayerHS';
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function loadHS(){ try { return JSON.parse(localStorage.getItem(HS_KEY)) || []; } catch (err){ return []; } }
function saveHS(rec){
  const l = loadHS(); l.push(rec); l.sort((a, b) => b.score - a.score);
  const top = l.slice(0, 10);
  try { localStorage.setItem(HS_KEY, JSON.stringify(top)); } catch (err){}
  return { list: top, rank: top.indexOf(rec) };
}
function hsTable(list, me){
  if (!list.length) return '<p>尚無紀錄，成為第一位討鬼人吧！</p>';
  return '<table><tr><th>#</th><th>名稱</th><th>分數</th><th>波</th></tr>' +
    list.slice(0, 8).map((r, i) => `<tr class="${r === me ? 'me' : ''}"><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${r.wave}</td></tr>`).join('') + '</table>';
}
function menu(){
  mode = 'menu';
  show(`<h1>MOONLIT SLAYER</h1><h2>月下討鬼 · 倖存者</h2>
  <p>限時波次：鬼群會由四面八方不斷湧上，每一波都比上一波強；過關後體力完全回復。</p>
  <p>移動：WASD / 方向鍵（手機：拖曳畫面）　招式自動施放，升級三選一<br>遠程鬼出手前會出現黃色預警圈　P 或右上按鈕暫停　M 靜音</p>
  <p>玩家名稱：<input id="nm" maxlength="12" value="${esc(playerName)}"></p>
  <p><button class="btn" id="go">開始（Enter）</button></p>
  <h3>排行榜</h3>${hsTable(loadHS())}`);
  document.getElementById('go').onclick = start;
  const nm = document.getElementById('nm'); if (nm && nm.focus){ nm.focus(); nm.select(); }
}
function pause(on){
  mode = on ? 'pause' : 'play';
  if (on) show(`<h2>暫停</h2><p><button class="btn" id="rs">繼續（P）</button></p>`), document.getElementById('rs').onclick = () => pause(false);
  else hide();
}
function start(){
  const nm = document.getElementById('nm');
  if (nm && typeof nm.value === 'string') playerName = (nm.value.trim() || '炭治郎').slice(0, 12);
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  startMusic();
  reset(); hide(); mode = 'play';
}
function mmss(s){ s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function gameOver(){
  if (mode === 'over') return;
  mode = 'over';
  const r = saveHS({ name:playerName, score:G.score, wave:G.wave, kills:G.kills, d:Date.now() });
  show(`<h2>倒下了…</h2>
  <p>${esc(playerName)}　得分 <b style="color:var(--flame);font-size:28px">${G.score}</b>${r.rank === 0 ? '　🏆 新紀錄！' : r.rank < 0 ? '（未進入前十名）' : '　第 ' + (r.rank + 1) + ' 名'}<br>
  撐到第 ${G.wave} 波　擊殺 ${G.kills}　等級 ${G.lvl}</p>
  <h3>排行榜</h3>${hsTable(r.list, r.list[r.rank])}
  <p><button class="btn" id="again">再戰一次（空白鍵）</button> <button class="btn" id="back">更改名稱</button></p>`);
  document.getElementById('again').onclick = start;
  document.getElementById('back').onclick = menu;
  sfx(160, .5, 'triangle', .07, -80);
}

/* ───────── 升級 ───────── */
let cards = [];
// 經驗曲線：前 10 級快速成型，之後逐步陡峭
function needXp(l){ return l <= 10 ? Math.floor(8 + 1.5 * l) : Math.floor(23 + (l - 10) * (l - 10) + 6 * (l - 10)); }
const EVO = { slash:'水面斬貫穿所有鬼、傷害 +30%', orbit:'水車傷害 +50%、命中更頻密', fire:'火焰範圍 +35%、傷害 +30%、可擋更遠彈幕',
  ripple:'突刺變成三向', dragon:'日暈之龍數量 +6', calm:'結界回復速度大幅加快' };
const evo = k => P.lv[k] >= UP[k].max;
const comboFx = () => (G.combo >= 50 ? .15 : G.combo >= 25 ? .1 : G.combo >= 10 ? .05 : 0);   // 連殺傷害加成
const SYN = [
  { n:'蒸氣爆發', d:'滴波紋突終點引爆火焰', ok:() => P.lv.fire > 0 && P.lv.ripple > 0 },
  { n:'日輪水刃', d:'日暈之龍發動時立刻再斬一輪', ok:() => P.lv.dragon > 0 && P.lv.slash > 0 },
  { n:'結界水車', d:'每層結界令水車傷害 +15%', ok:() => P.lv.calm > 0 && P.lv.orbit > 0 }
];
function levelUp(bonus){
  mode = 'levelup';
  burst(P.x, P.y - 18, 40, ['#ffe08a', '#fff', '#7fd6ff'], 260, 4, .8, 0); ringfx(P.x, P.y - 18, '#ffe08a', 140, .6);
  const nW = WEAPONS.filter(k => P.lv[k] > 0).length, nP = PASSIVES.filter(k => P.lv[k] > 0).length;
  const pool = Object.keys(UP).filter(k => {
    if (P.lv[k] >= UP[k].max) return false;
    if (P.lv[k] > 0) return true;                       // 已擁有：可繼續升級
    return WEAPONS.includes(k) ? nW < MAX_WEAPONS : nP < MAX_PASSIVES;   // 新項目：需有空位
  }).sort(() => Math.random() - .5);
  cards = pool.slice(0, 3);
  if (!cards.length){ P.hp = Math.min(P.max, P.hp + 30); mode = 'play'; return; }
  show(`<h2>${bonus ? '精英獎勵！額外強化' : '升級！選擇一項強化'}</h2><p>招式 ${nW}/${MAX_WEAPONS}　被動 ${nP}/${MAX_PASSIVES}</p><div class="cards">` + cards.map((k, i) =>
    `<button class="card" data-i="${i}"><b>${i + 1}. ${UP[k].n}</b><i>${P.lv[k] ? 'Lv ' + P.lv[k] + ' → ' + (P.lv[k] + 1) : '新招 / 新被動'}</i><span>${UP[k].d}${WEAPONS.includes(k) && P.lv[k] === UP[k].max - 1 ? '<br>★ 覺醒：' + EVO[k] : ''}</span></button>`).join('') + `</div>`);
  pn.querySelectorAll('.card').forEach(b => b.onclick = () => pickCard(+b.dataset.i));
  sfx(520, .25, 'triangle', .06, 520);
}
function pickCard(i){
  const k = cards[i]; if (!k) return;
  P.lv[k]++;
  const l = P.lv[k];
  if (k === 'spd') P.spd = CFG.baseSpeed * (1 + .1 * l);
  if (k === 'hp'){ P.max = 100 + 25 * l; P.hp = Math.min(P.max, P.hp + 25); }
  if (k === 'mag') P.mag = 70 * (1 + .4 * l);
  if (k === 'reg') P.regen = .6 * l;
  if (k === 'orbit') orbSw = [];
  if (k === 'calm'){ P.shieldMax = 1 + Math.floor((l - 1) / 2); P.shield = P.shieldMax; P.shT = 5; }
  if (WEAPONS.includes(k) && l === UP[k].max){ G.banner = { t:2.6, text:'★ 覺醒：' + UP[k].n, sub:EVO[k] }; sfx(660, .4, 'triangle', .07, 600); }
  const nsyn = SYN.filter(c => c.ok()).length;
  if (nsyn > (G.synN || 0)){ const c = SYN.filter(c => c.ok()).pop(); G.banner = { t:2.6, text:'合擊：' + c.n, sub:c.d }; }
  G.synN = nsyn;
  hide(); mode = 'play';
  if (G.freePick > 0){ G.freePick--; levelUp(true); return; }
  if (G.xp >= G.need) gainXp(0);
}
function gainXp(v){
  G.xp += v;

function update(dt){
  G.t += dt;
  if (G.banner) G.banner.t -= dt;

  // 移動
  let ix = (K.d || K.arrowright ? 1 : 0) - (K.a || K.arrowleft ? 1 : 0);
  let iy = (K.s || K.arrowdown ? 1 : 0) - (K.w || K.arrowup ? 1 : 0);
  if (J){ ix += (J.x - J.sx) / 60; iy += (J.y - J.sy) / 60; }
  const il = Math.hypot(ix, iy);
  P.moving = il > .1;
  if (il > 1){ ix /= il; iy /= il; }
  P.x += ix * P.spd * dt; P.y += iy * P.spd * dt;
  if (ix) P.face = ix > 0 ? 1 : -1;
  if (P.moving) P.walk += dt * 12;
  if (P.moving && Math.random() < .35) burst(P.x, P.y, 1, ['#c9b88a', '#8a7a5a'], 40, 3, .4, 0, false);
  P.inv -= dt; P.swing -= dt; G.shake = Math.max(0, G.shake - dt * 30);

    G.pvx = (G.pvx || 0) * .8 + (P.x - lx) * iv * .2; G.pvy = (G.pvy || 0) * .8 + (P.y - ly) * iv * .2; G.lpx = P.x; G.lpy = P.y;
    if (Math.hypot(G.pvx, G.pvy) > 30) G.ld = Math.atan2(G.pvy, G.pvx);
    G.still = P.moving ? Math.max(0, (G.still || 0) - dt * 3) : (G.still || 0) + dt;
    if (G.phase === 'fight' && G.wave >= 3 && G.still > 3){
      G.zT = (G.zT || 0) - dt; G.rT = (G.rT || 0) - dt;
      if (G.zT <= 0){ G.zT = 5; zones.push({ x:P.x, y:P.y, r:48, warn:1, life:2.5, dmg:4 + G.wave }); }   // 地面怨火

  if (G.phase === 'fight'){
    G.acc += (3 + .7 * G.wave) * (1 + .1 * (G.heat || 0)) * dt;
    while (G.acc >= 1){ G.acc -= 1; if (enemies.length >= CFG.maxEnemies){ G.acc = 0; break; } spawn(pickType()); }
    G.burstT -= dt;
    if (G.burstT <= 0){

      for (let i = 0; i < n && enemies.length < CFG.maxEnemies + 40; i++) spawn(Math.random() < .35 ? 1 : 0, o + i * 6.283 / n);
      G.banner = { t:1.6, text:'四面包圍！', sub:'' }; sfx(150, .3, 'sawtooth', .05, -60);
    }
  }

  // 敵人移動與接觸傷害

    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    let mv = 1; e.age += dt;
    if ((e.type === 4 || e.type === 5) && e.age < 14){ const want = e.type === 4 ? 240 : 280; mv = d > want + 20 ? 1 : (d < want - 60 ? -.7 : 0); }

  txt('LV ' + G.lvl, 16, 42, 24);
  ctx.fillStyle = '#000'; ctx.fillRect(14, 54, 252, 26); ctx.fillStyle = '#3a1013'; ctx.fillRect(16, 56, 248, 22);
  ctx.fillStyle = '#e0463c'; ctx.fillRect(16, 56, 248 * Math.max(0, P.hp) / P.max, 22);
  txt(`HP ${Math.ceil(Math.max(0, P.hp))}/${P.max}`, 24, 74, 18);
  txt('SCORE ' + G.score, 16, 114, 26, 'left', '#ffe9a8');
  if (G.combo >= 5) txt(`COMBO ${G.combo}  x${(1 + Math.min(2, G.combo * .02)).toFixed(2)}` + (comboFx() ? `  傷害 +${Math.round(comboFx() * 100)}%` : ''), 16, 144, 22, 'left', '#ff9a5a');
  txt('第 ' + G.wave + ' 波', W - 16, 46, 32, 'right');
  const rem = Math.ceil(Math.max(0, G.phase === 'fight' ? G.waveT : G.restT));
  txt((G.phase === 'fight' ? '剩餘 ' : '休整 ') + rem + ' 秒', W - 16, 76, 20, 'right');
  if (G.phase === 'fight'){ ctx.fillStyle = '#000'; ctx.fillRect(W - 178, 84, 162, 12); ctx.fillStyle = '#ffb347'; ctx.fillRect(W - 176, 86, 158 * (1 - G.waveT / waveDur(G.wave)), 8); }
  txt('擊殺 ' + G.kills + '　最高 ' + Math.max(G.best, G.score), W - 16, 118, 18, 'right');
  let yy = H - 16;
  for (const k of WEAPONS) if (P.lv[k] > 0){ txt(`${UP[k].n}  Lv ${P.lv[k]}${evo(k) ? '★' : ''}` + (k === 'calm' ? `（${P.shield}/${P.shieldMax}）` : k === 'orbit' ? `（${orbSw.slice(0, P.lv.orbit + 1).filter(w => w.hp > 0).length}/${P.lv.orbit + 1}）` : ''), 16, yy, 18); yy -= 26; }
  { const ac = SYN.filter(c => c.ok()); if (ac.length) txt('合擊：' + ac.map(c => c.n).join('、'), 16, yy, 16, 'left', '#9ff7ee'); }
  if ((G.heat || 0) > 0) txt('鬼氣 Lv ' + G.heat, W - 16, 142, 16, 'right', '#ff8a8a');
  if ((G.still || 0) > 1.5 && G.phase === 'fight') txt('鬼氣聚集…別停下！', W / 2, 130, 20, 'center', '#ff6a6a');
  const boss = enemies.find(e => e.type === 3);
  if (boss){ const bw = Math.min(480, W - 40), bx = (W - bw) / 2; ctx.fillStyle = '#000'; ctx.fillRect(bx - 2, 94, bw + 4, 18); ctx.fillStyle = '#8a1c2b'; ctx.fillRect(bx, 96, bw * boss.hp / boss.max, 14); txt('下弦之鬼', W / 2, 90, 16, 'center'); }
  if (G.banner && G.banner.t > 0){ txt(G.banner.text, W / 2, H * .3, 44, 'center', '#ffe9a8'); if (G.banner.sub) txt(G.banner.sub, W / 2, H * .3 + 36, 22, 'center'); }
  if (J){ ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(J.sx, J.sy, 50, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.arc(J.x, J.y, 20, 0, 6.283); ctx.stroke(); }
}

/* ───────── 主迴圈 ───────── */
let last = 0;
function loop(ts){
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (mode !== lastMode){ lastMode = mode; pb.style.display = (mode === 'play' || mode === 'pause') ? 'block' : 'none'; pb.textContent = mode === 'pause' ? '▶ 繼續' : '⏸ 暫停'; }
  if (mode === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset(); menu(); requestAnimationFrame(loop);
window.__test = { update, draw, start, playStep, menu, gameOver, get G(){ return G; }, get P(){ return P; }, pickCard, get mode(){ return mode; } };
})();
</script>
